    <!-- LocalForage: CDN 제거, 네이티브 IndexedDB 기반 자체 구현으로 대체 (오프라인/WebView 안전) -->
    <script>
      /* ═══════════════════════════════════════════════════════════════
         🗄️  NATIVE INDEXEDDB POLYFILL (localforage 대체)
         - 외부 CDN 의존성 완전 제거 → 오프라인/APK WebView에서도 100% 동작
         - localforage와 동일한 API 제공: getItem/setItem/removeItem/iterate/ready/createInstance
         - 전역 window.localforage 로 노출하여 기존 코드 수정 없이 호환
         ═══════════════════════════════════════════════════════════════ */
      (function () {
        "use strict";

        function openDb(dbName, storeName) {
          return new Promise((resolve, reject) => {
            if (!window.indexedDB) {
              reject(new Error("IndexedDB unsupported"));
              return;
            }
            const req = indexedDB.open(dbName, 1);
            req.onupgradeneeded = (e) => {
              const db = e.target.result;
              if (!db.objectStoreNames.contains(storeName)) {
                db.createObjectStore(storeName);
              }
            };
            req.onsuccess = (e) => resolve(e.target.result);
            req.onerror = (e) => reject(e.target.error || new Error("IndexedDB open failed"));
          });
        }

        // 메모리 폴백 (IndexedDB 자체를 못 쓰는 극단적 환경 대비)
        function memoryInstance() {
          const mem = new Map();
          return {
            async getItem(key) {
              return mem.has(key) ? mem.get(key) : null;
            },
            async setItem(key, value) {
              mem.set(key, value);
              return value;
            },
            async removeItem(key) {
              mem.delete(key);
            },
            async clear() {
              mem.clear();
            },
            async keys() {
              return Array.from(mem.keys());
            },
            async iterate(cb) {
              let i = 0;
              for (const [k, v] of mem.entries()) {
                const res = cb(v, k, ++i);
                if (res !== undefined) return res;
              }
            },
            async ready() {
              return true;
            },
          };
        }

        function createInstance(opts) {
          opts = opts || {};
          const dbName = opts.name || "localforage";
          const storeName = opts.storeName || "keyvaluepairs";
          let dbPromise = null;
          let failed = false;

          function getDb() {
            if (failed) return Promise.reject(new Error("indexeddb-unavailable"));
            if (!dbPromise) {
              dbPromise = openDb(dbName, storeName).catch((err) => {
                failed = true;
                console.warn("[IndexedDB] 사용 불가, 메모리 저장소로 대체:", err && err.message);
                throw err;
              });
            }
            return dbPromise;
          }

          const fallback = memoryInstance();
          let useFallback = false;

          function withStore(mode, fn) {
            if (useFallback) return fn(null);
            return getDb()
              .then((db) => {
                return new Promise((resolve, reject) => {
                  try {
                    const tx = db.transaction(storeName, mode);
                    const store = tx.objectStore(storeName);
                    const result = fn(store);
                    tx.oncomplete = () => resolve(result && result.__val !== undefined ? result.__val : result);
                    tx.onerror = () => reject(tx.error);
                  } catch (err) {
                    reject(err);
                  }
                });
              })
              .catch((err) => {
                useFallback = true;
                return fn(null);
              });
          }

          return {
            async getItem(key) {
              if (useFallback) return fallback.getItem(key);
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const req = tx.objectStore(storeName).get(key);
                      req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.getItem(key);
              }
            },
            async setItem(key, value) {
              if (useFallback) return fallback.setItem(key, value);
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).put(value, key);
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
                return value;
              } catch (e) {
                useFallback = true;
                return fallback.setItem(key, value);
              }
            },
            async removeItem(key) {
              if (useFallback) return fallback.removeItem(key);
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).delete(key);
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.removeItem(key);
              }
            },
            async clear() {
              if (useFallback) return fallback.clear();
              try {
                await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readwrite");
                      tx.objectStore(storeName).clear();
                      tx.oncomplete = () => resolve();
                      tx.onerror = () => reject(tx.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.clear();
              }
            },
            async keys() {
              if (useFallback) return fallback.keys();
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const req = tx.objectStore(storeName).getAllKeys();
                      req.onsuccess = () => resolve(req.result || []);
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.keys();
              }
            },
            async iterate(cb) {
              if (useFallback) return fallback.iterate(cb);
              try {
                return await getDb().then(
                  (db) =>
                    new Promise((resolve, reject) => {
                      const tx = db.transaction(storeName, "readonly");
                      const store = tx.objectStore(storeName);
                      const req = store.openCursor();
                      let i = 0;
                      req.onsuccess = (e) => {
                        const cursor = e.target.result;
                        if (cursor) {
                          const res = cb(cursor.value, cursor.key, ++i);
                          if (res !== undefined) {
                            resolve(res);
                            return;
                          }
                          cursor.continue();
                        } else {
                          resolve(undefined);
                        }
                      };
                      req.onerror = () => reject(req.error);
                    }),
                );
              } catch (e) {
                useFallback = true;
                return fallback.iterate(cb);
              }
            },
            async ready() {
              try {
                await getDb();
              } catch (e) {
                useFallback = true;
              }
              return true;
            },
          };
        }

        // 기본(default) 인스턴스 — localforage.getItem(...) 형태의 전역 직접 호출 호환용
        const defaultInstance = createInstance({ name: "localforage", storeName: "keyvaluepairs" });

        window.localforage = {
          getItem: (k) => defaultInstance.getItem(k),
          setItem: (k, v) => defaultInstance.setItem(k, v),
          removeItem: (k) => defaultInstance.removeItem(k),
          clear: () => defaultInstance.clear(),
          keys: () => defaultInstance.keys(),
          iterate: (cb) => defaultInstance.iterate(cb),
          ready: () => defaultInstance.ready(),
          createInstance: createInstance,
        };
      })();

      const LocalDB = {

      let sb;
      const supabaseReady = (async function initLocalSB() {

        window.addEventListener("offline", () => setState({ isOnline: false, syncStatus: "오프라인 · 기기에 저장 중" }));

        const chain = (table) => {
          let filters = [];
          let sortCol = "created_at";
          let ascending = false;

          const p = {
            select: () => p,
            insert: (row) => ({
              select: () => ({
                single: () => ({
                  then: async (resolve) => {
                    const data = await LocalDB.get(table);
                    const newRow = {
                      id: row.id || "id-" + Date.now() + "-" + Math.random().toString(36).slice(2),
                      created_at: new Date().toISOString(),
                      updated_at: new Date().toISOString(),
                      ...row,
                    };
                    data.unshift(newRow);
                    await LocalDB.save(table, data);
                    if (resolve) resolve({ data: newRow, error: null });
                    return { data: newRow, error: null };
                  },
                }),
              }),
            }),
            update: (updates) => ({
              eq: (col, val) => ({
                then: async (resolve) => {
                  const data = await LocalDB.get(table);
                  const idx = data.findIndex((x) => x[col] === val);
                  if (idx !== -1) {
                    data[idx] = { ...data[idx], ...updates, updated_at: new Date().toISOString() };
                    await LocalDB.save(table, data);
                    if (resolve) resolve({ data: data[idx], error: null });
                    return { data: data[idx], error: null };
                  } else {
                    if (resolve) resolve({ data: null, error: { message: "Not found" } });
                    return { data: null, error: { message: "Not found" } };
                  }
                },
              }),
            }),
            delete: () => ({
              eq: (col, val) => ({
                then: async (resolve) => {
                  const data = await LocalDB.get(table);
                  const filtered = data.filter((x) => x[col] !== val);
                  await LocalDB.save(table, filtered);
                  if (resolve) resolve({ error: null });
                  return { error: null };
                },
              }),
            }),
            eq: (k, v) => {
              filters.push({ k, v });
              return p;
            },
            or: (query) => {
              filters.push({ or: query });
              return p;
            },
            order: (col, opts) => {
              sortCol = col;
              ascending = opts?.ascending || false;
              return p;
            },
            single: () => ({
              then: async (resolve) => {
                const { data, error } = await p.then((r) => r);
                const res = { data: data ? data[0] : null, error };
                if (resolve) resolve(res);
                return res;
              },
            }),
            then: async (resolve) => {
              let data = await LocalDB.get(table);
              for (const f of filters) {
                if (f.or) {
                  data = data.filter((x) => x.user_id === S.user?.id || x.is_public === true);
                } else {
                  data = data.filter((x) => x[f.k] === f.v);
                }
              }
              data.sort((a, b) => {
                const va = a[sortCol],
                  vb = b[sortCol];
                if (va < vb) return ascending ? -1 : 1;
                if (va > vb) return ascending ? 1 : -1;
                return 0;
              });
              if (resolve) resolve({ data, error: null });
              return { data, error: null };
            },
          };
          return p;
        };

        sb = {

      // ═══════════════════════════════════════════════════════════════
      // 📦  LOCALFORAGE STORES (파일 영구 저장) — CDN 실패 대비 폴백 포함
      // ═══════════════════════════════════════════════════════════════
      function makeStore(opts) {
        if (typeof localforage !== "undefined" && localforage.createInstance) {
          return localforage.createInstance(opts);
        }
        // localforage 로드 실패 시: 메모리 기반 더미 스토어로 대체 (새로고침 시 사라짐)
        const mem = new Map();
        return {
          async getItem(k) {
            return mem.has(k) ? mem.get(k) : null;
          },
          async setItem(k, v) {
            mem.set(k, v);
            return v;
          },
          async removeItem(k) {
            mem.delete(k);
          },
          async iterate(cb) {
            let i = 0;
            for (const [k, v] of mem.entries()) {
              cb(v, k, ++i);
            }
          },
          async ready() {
            return true;
          },
        };
      }
      const blobStore = makeStore({ name: "aichat-files", storeName: "blobs" });
      const metaStore = makeStore({ name: "aichat-files", storeName: "meta" });
      const msgFileStore = makeStore({ name: "aichat-files", storeName: "msg_files" });
      const convStore = makeStore({ name: "aichat-offline", storeName: "conversations" });
      const msgStore = makeStore({ name: "aichat-offline", storeName: "messages" });

      const TEXT_EXTS = new Set([
        "txt",
        "md",
        "csv",
        "json",
        "log",
        "xml",
        "yaml",
        "yml",
        "ts",
        "tsx",

        "kt",

        "rb",
      ]);
      function fileType(file) {
        if (file.type.startsWith("image/")) return "image";
        if (file.type.startsWith("text/") || file.type === "application/json") return "text";
        const e = file.name.split(".").pop()?.toLowerCase() || "";
        return TEXT_EXTS.has(e) ? "text" : "other";
      }
      function fmtSize(b) {
        if (b < 1024) return b + "B";
        if (b < 1048576) return (b / 1024).toFixed(1) + "KB";
        return (b / 1048576).toFixed(1) + "MB";
      }

      async function storeFileLF(file, ctx = {}) {
        const id = `f-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
        const type = fileType(file);
        let textContent;
        if (type === "text") {
          try {
            const raw = await file.text();
            textContent = raw.length > 50000 ? raw.slice(0, 50000) + "\n...(생략)" : raw;
          } catch {}
        }
        const meta = {
          id,
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          size: file.size,
          type,
          textContent,
          createdAt: new Date().toISOString(),
          ...ctx,
        };
        await blobStore.setItem(id, file.slice(0, file.size, file.type));
        await metaStore.setItem(id, meta);
        return meta;
      }
      async function getFileBlob(id) {
        try {
          return await blobStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function getFileMeta(id) {
        try {
          return await metaStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function createObjUrl(id) {
        const b = await getFileBlob(id);
        return b ? URL.createObjectURL(b) : null;
      }
      async function fileToBase64(id) {
        const b = await getFileBlob(id);
        if (!b) return null;
        return new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = (e) => res(e.target.result);
          r.onerror = rej;
          r.readAsDataURL(b);
        });
      }
      async function setMsgFiles(msgId, ids) {
        if (!msgId || !ids.length) return;

      async function getMsgFileMetas(msgId) {
        const ids = await getMsgFiles(msgId);
        if (!ids.length) return [];
        const r = await Promise.all(ids.map(getFileMeta));
        return r.filter(Boolean);
      }

      function newDeviceId() {

      async function saveDeviceProfile(changes) {

        // Object URL은 현재 탭에서만 유효하므로 IndexedDB에는 파일 ID와 메타데이터만 저장합니다.

      async function hydrateProfileMedia(profile) {

      async function getCloudConfig() {
        const stored = await profileStore.getItem(CLOUD_CONFIG_KEY).catch(() => null);

      async function saveCloudConfig(url, anonKey) {
        const normalizedUrl = String(url || "").trim().replace(/\/$/, "");
        const normalizedKey = String(anonKey || "").trim();
        if (!/^https:\/\//i.test(normalizedUrl) || !normalizedKey) {
          throw new Error("유효한 HTTPS Supabase URL과 Anon Key를 입력하세요.");
        }
        await profileStore.setItem(CLOUD_CONFIG_KEY, { url: normalizedUrl, anonKey: normalizedKey });
        cloudClient = null;
        cloudClientKey = "";
      }

      async function getCloudClient() {
        const config = await getCloudConfig();
        if (!config.url || !config.anonKey) return null;
        const key = `${config.url}|${config.anonKey}`;
        if (cloudClient && cloudClientKey === key) return cloudClient;
        const { createClient } = await import("https://esm.sh/@supabase/supabase-js@2.49.8");
        cloudClient = createClient(config.url, config.anonKey, {
          auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
        });
        cloudClientKey = key;
        return cloudClient;
      }

      async function updateSyncCount() {
        let count = 0;
        await syncStore.iterate(() => {
          count += 1;
        }).catch(() => {});
        if (typeof S !== "undefined") setState({ syncPending: count });
        return count;
      }

      async function queueSync(kind, record) {
        if (!record?.id) return;
        await syncStore.setItem(`${kind}:${record.id}`, {
          kind,
          record: { ...record },
          queued_at: new Date().toISOString(),
          attempts: 0,
        });
        await updateSyncCount();
        if (navigator.onLine) void flushSyncQueue();
      }

      async function flushSyncQueue() {
        if (!navigator.onLine || !S?.account?.connected || S.syncing) return false;
        const client = await getCloudClient().catch(() => null);
        if (!client) return false;
        setState({ syncing: true, syncStatus: "동기화 중" });
        let failed = false;
        try {
          const { data: sessionData } = await client.auth.getSession();
          const accountId = sessionData?.session?.user?.id;
          if (!accountId) return false;
          const jobs = [];
          await syncStore.iterate((job, key) => jobs.push({ job, key }));
          // 프로필 파일을 먼저 올린 뒤 프로필 메타데이터를 반영합니다.
          jobs.sort((a, b) => (a.job.kind === "profileFile" ? -1 : 0) - (b.job.kind === "profileFile" ? -1 : 0));
          for (const { job, key } of jobs) {
            try {
              let error = null;
              if (job.kind === "conversation") {
                ({ error } = await client.from("conversations").upsert({ ...job.record, user_id: accountId }, { onConflict: "id" }));
              } else if (job.kind === "message") {
                ({ error } = await client.from("messages").upsert(job.record, { onConflict: "id" }));
              } else if (job.kind === "profileFile") {
                const blob = await getFileBlob(job.record.id);
                if (!blob) throw new Error("프로필 파일을 이 기기에서 찾지 못했습니다.");
                const safeName = String(job.record.name || "file").replace(/[^a-zA-Z0-9._-]/g, "_");
                const path = `${accountId}/profile/${job.record.id}-${safeName}`;
                ({ error } = await client.storage.from("chat-files").upload(path, blob, {
                  upsert: true,
                  contentType: job.record.mimeType || "application/octet-stream",
                }));
                if (!error) {
                  const profile = await getDeviceProfile();
                  const changes = job.record.role === "profile-avatar"
                    ? { avatarCloudPath: path }
                    : { documents: (profile.documents || []).map((document) => document.id === job.record.id ? { ...document, cloudPath: path } : document) };
                  const updated = await saveDeviceProfile(changes);
                  await queueSync("profile", updated);
                }
              } else if (job.kind === "profile") {
                ({ error } = await client.auth.updateUser({
                  data: {
                    username: job.record.username,
                    avatar_url: job.record.avatar || "",
                    avatar_path: job.record.avatarCloudPath || "",
                    bio: job.record.bio || "",
                    documents: (job.record.documents || []).map(({ id, name, mimeType, size, cloudPath }) => ({ id, name, mimeType, size, cloudPath: cloudPath || "" })),
                  },
                }));
              }
              if (error) throw error;
              await syncStore.removeItem(key);
            } catch (error) {
              failed = true;
              await syncStore.setItem(key, { ...job, attempts: (job.attempts || 0) + 1, last_error: String(error?.message || error) });
            }
          }
          const pending = await updateSyncCount();
          setState({ syncStatus: failed ? "일부 동기화 대기" : pending ? "동기화 대기" : "동기화 완료" });
          return !failed;
        } finally {
          setState({ syncing: false });
        }
      }

      async function pullCloudData() {
        if (!S?.account?.connected) return false;
        const client = await getCloudClient().catch(() => null);
        if (!client) return false;
        const { data: sessionData } = await client.auth.getSession();
        const accountId = sessionData?.session?.user?.id;
        if (!accountId || !S.user?.id) return false;
        const { data: remoteConversations, error: conversationsError } = await client
          .from("conversations")
          .select("*")
          .eq("user_id", accountId)
          .order("updated_at", { ascending: false });
        if (conversationsError) throw conversationsError;
        for (const conversation of remoteConversations || []) {
          await convStore.setItem(conversation.id, { ...conversation, user_id: S.user.id });
          const { data: remoteMessages, error: messagesError } = await client
            .from("messages")
            .select("*")
            .eq("conversation_id", conversation.id)
            .order("created_at", { ascending: true });
          if (messagesError) throw messagesError;
          for (const message of remoteMessages || []) await msgStore.setItem(message.id, message);
        }
        const conversations = await getCachedConvs(S.user.id);
        const currentMessages = S.currentConvId ? await getCachedMsgs(S.currentConvId) : S.messages;
        setState({ conversations, messages: currentMessages, syncStatus: "동기화 완료" });
        return true;
      }

      async function refreshCloudAccount() {
        const client = await getCloudClient().catch(() => null);
        if (!client) return null;
        const { data } = await client.auth.getSession();
        const remoteUser = data?.session?.user;
        if (!remoteUser) return null;
        const device = await getDeviceProfile();
        const linked = await saveDeviceProfile({
          accountId: remoteUser.id,
          email: remoteUser.email || "",
          username: remoteUser.user_metadata?.username || device.username,
          avatar: remoteUser.user_metadata?.avatar_url || device.avatar || "",
          bio: remoteUser.user_metadata?.bio || device.bio || "",
          isAnonymous: false,
        });
        setState({ user: linked, account: { connected: true, provider: remoteUser.app_metadata?.provider || "email" } });
        await queueSync("profile", linked);
        await flushSyncQueue();
        await pullCloudData().catch((error) => console.warn("원격 데이터 수신 동기화 실패:", error));
        return linked;
      }

      function toast(msg, type = "info", dur = 3000) {
        const el = document.createElement("div");
        el.className = `toast ${type}`;
        el.textContent = msg;
        const c = document.getElementById("toast-container");
        if (!c) return;
        c.appendChild(el);
        setTimeout(() => {
          el.style.opacity = "0";
          el.style.transition = "opacity 0.3s";
          setTimeout(() => el.remove(), 300);
        }, dur);

      // 네트워크 요청이 응답 없이 멈추는 경우를 대비한 타임아웃 헬퍼
      function withTimeout(promise, ms, fallback) {
        return new Promise((resolve) => {
          let done = false;
          const timer = setTimeout(() => {
            if (!done) {
              done = true;
              resolve(fallback);
            }
          }, ms);
          promise.then(
            (v) => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(v);
              }
            },
            () => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(fallback);
              }
            },
          );
        });
      }

      // ═══════════════════════════════════════════════════════════════
      // 💬  CHAT
      // ═══════════════════════════════════════════════════════════════
      async function processFiles(files, convId) {
        const attachments = [];
        for (const file of files) {
          try {
            const meta = await storeFileLF(file, { conversationId: convId });
            if (meta.type === "image") {
              if (!navigator.onLine) {
                const b64 = await fileToBase64(meta.id);
                if (b64)
                  attachments.push({
                    name: file.name,
                    mimeType: file.type,
                    type: "image",
                    base64: b64,
                    localId: meta.id,
                  });
              } else {
                const safe = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
                const path = `${S.user.id}/chat/${Date.now()}_${safe}`;
                const { data, error } = await sb.storage.from("chat-files").upload(path, file);
                if (error) {
                  const b64 = await fileToBase64(meta.id);
                  if (b64)
                    attachments.push({
                      name: file.name,
                      mimeType: file.type,
                      type: "image",
                      base64: b64,
                      localId: meta.id,
                    });
                } else {
                  const { data: signed, error: signedError } = await sb.storage
                    .from("chat-files")
                    .createSignedUrl(data.path, 3600);
                  if (signedError || !signed?.signedUrl) {
                    const b64 = await fileToBase64(meta.id);
                    if (b64) {
                      attachments.push({
                        name: file.name,
                        mimeType: file.type,
                        type: "image",
                        base64: b64,
                        localId: meta.id,
                      });
                    }
                  } else {
                    attachments.push({
                      name: file.name,
                      mimeType: file.type,
                      type: "image",
                      url: signed.signedUrl,
                      localId: meta.id,
                    });
                  }
                }
              }
            } else if (meta.type === "text") {
              attachments.push({
                name: file.name,
                mimeType: file.type,
                type: "text",
                textContent: meta.textContent,
                localId: meta.id,
              });
            } else {
              attachments.push({ name: file.name, mimeType: file.type, type: "other", localId: meta.id });
            }
          } catch (e) {
            console.error(e);
            toast(`파일 처리 실패: ${file.name}`, "error");
          }
        }
        return attachments;
      }

      async function finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent) {
        const assistantMessage = {
          id: `tmp-${Date.now()}`,
          conversation_id: convId,
          role: "assistant",
          content: full,
          created_at: new Date().toISOString(),
        };

        if (isGuest) {
          assistantMessage.id = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
          setState({ messages: [...S.messages, assistantMessage], streamingMsg: "", isStreaming: false });
          await cacheMsgLF(assistantMessage).catch(() => {});
        } else {
          const { data, error } = await sb
            .from("messages")
            .insert({ conversation_id: convId, role: "assistant", content: full })
            .select()
            .single();
          const finalMessage = error ? assistantMessage : { ...data };
          setState({ messages: [...S.messages, finalMessage], streamingMsg: "", isStreaming: false });
          if (!error) await cacheMsgLF(finalMessage).catch(() => {});
        }

        if (currentMsgs.length === 1) {
          const newTitle = trimmed.slice(0, 50) || displayContent.slice(0, 50);
          if (!isGuest) {
            sb.from("conversations")
              .update({ title: newTitle, updated_at: new Date().toISOString() })
              .eq("id", convId)
              .then(() => {});
          }
          const updatedAt = new Date().toISOString();
          const updatedConversations = S.conversations.map((conversation) =>
            conversation.id === convId ? { ...conversation, title: newTitle, updated_at: updatedAt } : conversation,
          );
          setState({ conversations: updatedConversations });
          const updatedConversation = updatedConversations.find((conversation) => conversation.id === convId);
          if (updatedConversation) await cacheConv(updatedConversation).catch(() => {});
        }
      }

      async function sendMessage(content, filesToSend = []) {
        if (!S.user) {
          toast("게스트 로그인 또는 로그인이 필요합니다", "error");
          return false;
        }
        const trimmed = content.trim();
        if (!trimmed && filesToSend.length === 0) return false;
        if (S.isStreaming) return false;

        let convId = S.currentConvId;
        let savedMsgId = null;
        const tempId = `temp-${Date.now()}`;
        const isGuest = true;

        // Determine system prompt / instructions
        let sysPrompt = S.currentGPT?.system_prompt;
        let instructions = S.currentGPT?.instructions;
        if (convId && !S.currentGPT) {
          const cv = S.conversations.find((c) => c.id === convId);
          if (cv) {
            sysPrompt = cv.system_prompt;
            instructions = cv.instructions;
          }
        }

        // Create conversation if needed
        if (!convId) {
          const title = trimmed.slice(0, 50) || filesToSend[0]?.name || "새 대화";
          if (isGuest) {
            const nc = {
              id: `local-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
              user_id: S.user.id,
              title,
              custom_gpt_id: S.currentGPT?.id || null,
              system_prompt: sysPrompt || "",
              instructions: instructions || "",
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            };
            convId = nc.id;
            setState({ conversations: [nc, ...S.conversations], currentConvId: convId });
            await cacheConv(nc).catch(() => {});
          } else {
            const { data, error } = await sb
              .from("conversations")
              .insert({
                user_id: S.user.id,
                title,
                custom_gpt_id: S.currentGPT?.id || null,
                system_prompt: sysPrompt || "",
                instructions: instructions || "",
              })
              .select()
              .single();
            if (error) {
              toast("대화 생성 실패", "error");
              return;
            }
            convId = data.id;
            setState({ conversations: [data, ...S.conversations], currentConvId: convId });
            await cacheConv(data).catch(() => {});
          }
        }

        // Process files
        let chatAttachments = [];
        if (filesToSend.length > 0) {
          chatAttachments = await processFiles(filesToSend, convId);
        }
        const localFileIds = chatAttachments.map((a) => a.localId).filter(Boolean);

        // Build display content
        const imgCnt = chatAttachments.filter((a) => a.type === "image").length;
        const displayContent = trimmed || (imgCnt > 0 ? `📷 이미지 ${imgCnt}개` : `📎 파일 ${filesToSend.length}개`);

        const userMsg = {
          id: tempId,
          conversation_id: convId,
          role: "user",
          content: displayContent,
          created_at: new Date().toISOString(),
          localFileIds: localFileIds.length > 0 ? localFileIds : undefined,
        };
        const currentMsgs = [...S.messages, userMsg];
        setState({ messages: currentMsgs, isStreaming: true, streamingMsg: "", attachedFiles: [] });

        // Save user message
        if (isGuest) {
          savedMsgId = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
          const savedMsg = { ...userMsg, id: savedMsgId };
          await cacheMsgLF(savedMsg).catch(() => {});
          setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
        } else {
          const { data, error } = await sb
            .from("messages")
            .insert({ conversation_id: convId, role: "user", content: displayContent })
            .select()
            .single();
          if (!error) {
            savedMsgId = data.id;
            const savedMsg = { ...data, localFileIds: localFileIds.length > 0 ? localFileIds : undefined };
            await cacheMsgLF(savedMsg).catch(() => {});
            setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
          }
        }

        // Link files to message
        if (localFileIds.length > 0 && savedMsgId) {
          await setMsgFiles(savedMsgId, localFileIds).catch(() => {});
        }

        // 오프라인에서는 메시지를 로컬에 보존하고, 연결 복귀 뒤 사용자가 다시 전송할 수 있게 합니다.
        if (!S.isOnline) {
          setState({ isStreaming: false, streamingMsg: "" });
          toast("오프라인 상태입니다. 메시지를 로컬에 저장했습니다.", "info");
          return true;
        }

        // 선택된 로컬 GGUF 모델은 네트워크 요청 없이 현재 브라우저에서 실행합니다.
        if (S.localModel?.ready && window.LocalGGUF) {
          try {
            const localMessages = [];
            if (sysPrompt) localMessages.push({ role: "system", content: sysPrompt });
            if (instructions) localMessages.push({ role: "system", content: instructions });
            localMessages.push(...currentMsgs.map((message) => ({ role: message.role, content: message.content })));

            const textAttachments = chatAttachments
              .filter((attachment) => attachment.type === "text" && attachment.textContent)
              .map((attachment) => `\n\n[첨부 파일: ${attachment.name}]\n${attachment.textContent.slice(0, 8000)}`)
              .join("");
            if (textAttachments && localMessages.length) {
              localMessages[localMessages.length - 1].content += textAttachments;
            }
            if (chatAttachments.some((attachment) => attachment.type === "image")) {
              toast("현재 로컬 텍스트 모델은 이미지 입력을 분석하지 않습니다. 이미지 없이 텍스트로 응답합니다.", "info", 4500);
            }

            const full = await window.LocalGGUF.generate(localMessages, {
              onToken: (token) => setState({ streamingMsg: `${S.streamingMsg}${token}` }),
            });
            await finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent);
            setState({ localModel: window.LocalGGUF.getStatus() });
            return true;
          } catch (error) {
            console.error("local GGUF error:", error);
            setState({ isStreaming: false, streamingMsg: "", localModel: window.LocalGGUF.getStatus() });
            toast(error instanceof Error ? error.message : "로컬 모델 응답 생성에 실패했습니다.", "error", 6000);
            // 사용자 메시지는 이미 로컬에 저장되었으므로 중복 전송을 막기 위해 입력은 비웁니다.
            return !!savedMsgId;
          }
        }

        // Stream from AI
        try {
          const {
            data: { session },
          } = await sb.auth.getSession();
          const token = session?.access_token || (isGuest ? "guest-token" : "anon");

          const resp = await fetch(EDGE_FUNCTION_URL, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: currentMsgs.map((m) => ({ role: m.role, content: m.content })),
              systemPrompt: sysPrompt,
              instructions,
              gptFiles: S.currentGPTFiles.length > 0 ? S.currentGPTFiles : undefined,
              chatAttachments: chatAttachments.length > 0 ? chatAttachments : undefined,
              lastUserContent: trimmed,
            }),
          });

          if (!resp.ok) {
            let errMsg = "AI 응답 실패";
            try {
              const t = await resp.text();
              try {
                const j = JSON.parse(t);
                errMsg = j.error || j.message || errMsg;
              } catch {
                errMsg = t.slice(0, 150) || errMsg;
              }
            } catch {}
            if (resp.status === 402) errMsg = "AI 서비스 크레딧이 부족합니다. 관리자에게 문의하세요";
            else if (resp.status === 429) errMsg = "요청이 너무 많습니다. 잠시 후 다시 시도해주세요";
            else if (resp.status >= 500) errMsg = "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요";
            throw new Error(errMsg);
          }

          if (!resp.body) throw new Error("AI 응답 스트림을 받지 못했습니다");
          const reader = resp.body.getReader();
          const dec = new TextDecoder();
          let full = "",
            buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop() || "";
            for (const line of lines) {
              if (!line.includes("data:")) continue;
              const js = line.replace(/^data:\s*/, "").trim();
              if (js === "[DONE]") continue;
              try {
                const p = JSON.parse(js);
                const d = p.choices?.[0]?.delta?.content || "";
                if (d) {
                  full += d;
                  setState({ streamingMsg: full });
                }
              } catch {}
            }
          }

          // 마지막 청크가 줄바꿈 없이 종료된 SSE 응답도 처리합니다.
          const remaining = (buf + dec.decode()).trim();
          if (remaining.startsWith("data:")) {
            try {
              const pending = JSON.parse(remaining.replace(/^data:\\s*/, "").trim());
              const delta = pending.choices?.[0]?.delta?.content || "";
              if (delta) {
                full += delta;
                setState({ streamingMsg: full });
              }
            } catch {}
          }

          if (!full.trim()) throw new Error("AI가 응답을 생성하지 못했습니다");

          await finalizeAssistantResponse(full, convId, isGuest, currentMsgs, trimmed, displayContent);
          return true;
        } catch (err) {
          console.error("sendMessage error:", err);
          setState({ isStreaming: false, streamingMsg: "" });
          if (!savedMsgId) setState({ messages: S.messages.filter((m) => m.id !== tempId) });
          toast(err instanceof Error ? err.message : "메시지 전송에 실패했습니다", "error");
          // 사용자 메시지가 이미 저장된 경우 입력을 보존하면 같은 메시지가 중복 전송될 수 있습니다.
          return !!savedMsgId;
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🤖  GPT BUILDER
      // ═══════════════════════════════════════════════════════════════
      let gptBuilderFiles = []; // tmp before save
      let gptModalPendingDeletes = []; // 기존 DB 파일 중 삭제 예정 목록

      // 커스텀 GPT의 기존 파일을 DB에서 로드
      async function loadGPTFiles(gptId) {
        try {
          const { data, error } = await sb
            .from("custom_gpt_files")
            .select("*")
            .eq("custom_gpt_id", gptId)

          if (error) throw error;
          return (data || []).map((f) => ({ ...f, isExisting: true }));

      async function deleteGPTFileFromDB(file) {
        try {
          if (file.file_path) {
            await sb.storage.from("chat-files").remove([file.file_path]);
          }
          if (file.id && file.isExisting) {
            await sb.from("custom_gpt_files").delete().eq("id", file.id);
          }
        } catch (e) {
          console.error("파일 삭제 실패:", e);
        }
      }

      async function saveGPT(formData) {
        const uid = S.user?.id;
        if (!uid) {
          toast("GPT 저장은 로그인 후 이용 가능합니다", "error");
          return;
        }
        const editing = S.gptBuilderEditing;
        try {
          if (editing) {
            const { data, error } = await sb
              .from("custom_gpts")
              .update({
                name: formData.name,
                description: formData.description,
                system_prompt: formData.systemPrompt,
                instructions: formData.instructions,
                avatar_url: formData.avatarUrl || null,
                is_public: formData.isPublic,
                updated_at: new Date().toISOString(),
              })
              .eq("id", editing.id)
              .select()
              .single();
            if (error) throw error;
            // 삭제 예정 파일 처리 (DB + Storage)
            for (const f of gptModalPendingDeletes) {
              await deleteGPTFileFromDB(f);
            }
            gptModalPendingDeletes = [];
            // 새로 추가된 파일만 저장
            for (const f of gptBuilderFiles) {
              if (!f.isExisting) {
                await sb
                  .from("custom_gpt_files")
                  .insert({
                    custom_gpt_id: editing.id,
                    file_name: f.file_name,
                    file_url: f.file_url || "",
                    file_path: f.file_path || "",
                    file_size: f.file_size,
                    mime_type: f.mime_type,
                    file_content: f.file_content,
                  })
                  .then(() => {});
              }
            }
            setState({
              customGPTs: S.customGPTs.map((g) => (g.id === editing.id ? data : g)),
              gptBuilderOpen: false,
              gptBuilderEditing: null,
            });
            toast("커스텀 GPT가 수정되었습니다", "success");
          } else {
            const { data, error } = await sb
              .from("custom_gpts")
              .insert({
                user_id: uid,
                name: formData.name,
                description: formData.description,
                system_prompt: formData.systemPrompt,
                instructions: formData.instructions,
                avatar_url: formData.avatarUrl || null,
                is_public: formData.isPublic,
              })
              .select()
              .single();
            if (error) throw error;
            for (const f of gptBuilderFiles) {
              await sb
                .from("custom_gpt_files")
                .insert({
                  custom_gpt_id: data.id,
                  file_name: f.file_name,
                  file_url: f.file_url || "",
                  file_path: f.file_path || "",
                  file_size: f.file_size,
                  mime_type: f.mime_type,
                  file_content: f.file_content,
                })
                .then(() => {});

          }
          gptBuilderFiles = [];
        } catch (e) {
          toast("저장에 실패했습니다: " + e.message, "error");
        }
      }

        const { error } = await sb.from("custom_gpts").delete().eq("id", id);

      function bindAuth() {
        document.getElementById("auth-email")?.addEventListener("input", (e) => {
          authState.email = e.target.value;
        });
        document.getElementById("auth-switch")?.addEventListener("click", () => {
          authState.isLogin = !authState.isLogin;
          authState.otpSent = false;
          authState.otp = "";
          renderAuth();
        });

      async function doSendOtp() {
        authState.loading = true;
        renderAuthExtra();
        const { error } = await sb.auth.signInWithOtp({ email: authState.email, options: { shouldCreateUser: true } });
        authState.loading = false;
        if (error) {
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        authState.otpSent = true;
        toast("인증 코드가 이메일로 전송되었습니다", "success");
        renderAuthExtra();
      }

      async function doRegister() {
        authState.loading = true;
        renderAuthExtra();
        const { data, error } = await sb.auth.verifyOtp({
          email: authState.email,
          token: authState.otp,
          type: "email",
        });
        if (error) {
          authState.loading = false;
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        const { error: ue } = await sb.auth.updateUser({
          password: authState.pw,
          data: { username: authState.email.split("@")[0] },
        });
        if (ue) {
          authState.loading = false;
          toast(ue.message, "error");
          renderAuthExtra();
          return;
        }
        setState({ user: mapUser(data.user), view: "chat" });
        await loadUserData();
        authState.loading = false;
      }

      const PROFILE_IMAGE_MAX_BYTES = 5 * 1024 * 1024;
      const PROFILE_DOCUMENT_MAX_BYTES = 10 * 1024 * 1024;
      const PROFILE_DOCUMENT_TOTAL_MAX_BYTES = 25 * 1024 * 1024;
      const PROFILE_DOCUMENT_MAX_COUNT = 10;

      async function saveProfileAvatar(file) {
        if (!file?.type?.startsWith("image/")) throw new Error("프로필 이미지는 이미지 파일만 사용할 수 있습니다.");
        if (!file.size || file.size > PROFILE_IMAGE_MAX_BYTES) throw new Error("프로필 이미지는 5MB 이하만 사용할 수 있습니다.");
        const oldAvatarId = S.user?.avatarFileId;
        const meta = await storeFileLF(file, { profileId: S.user?.id, role: "profile-avatar" });
        await queueSync("profileFile", { ...meta, role: "profile-avatar" });
        const avatarPreview = await createObjUrl(meta.id);
        if (oldAvatarId && oldAvatarId !== meta.id) {
          await blobStore.removeItem(oldAvatarId).catch(() => {});
          await metaStore.removeItem(oldAvatarId).catch(() => {});
          await syncStore.removeItem(`profileFile:${oldAvatarId}`).catch(() => {});
        }
        return { avatarFileId: meta.id, avatarPreview: avatarPreview || "", avatar: "" };
      }

      async function addProfileDocuments(files) {
        const existing = await getProfileDocuments();
        const accepted = [];
        let total = existing.reduce((sum, document) => sum + (document.size || 0), 0);
        for (const file of Array.from(files || [])) {
          if (existing.length + accepted.length >= PROFILE_DOCUMENT_MAX_COUNT) break;
          if (!file.size || file.size > PROFILE_DOCUMENT_MAX_BYTES) continue;
          if (total + file.size > PROFILE_DOCUMENT_TOTAL_MAX_BYTES) break;
          const meta = await storeFileLF(file, { profileId: S.user?.id, role: "profile-document" });
          await queueSync("profileFile", { ...meta, role: "profile-document" });
          accepted.push({ id: meta.id, name: meta.name, mimeType: meta.mimeType, size: meta.size, type: meta.type, createdAt: meta.createdAt });
          total += file.size;
        }
        if (!accepted.length && files?.length) throw new Error("문서는 파일당 10MB, 총 25MB, 최대 10개까지 저장할 수 있습니다.");
        return [...existing, ...accepted];
      }

      async function removeProfileDocument(documentId) {
        const documents = await getProfileDocuments();
        const nextDocuments = documents.filter((document) => document.id !== documentId);
        await blobStore.removeItem(documentId).catch(() => {});
        await metaStore.removeItem(documentId).catch(() => {});
        await syncStore.removeItem(`profileFile:${documentId}`).catch(() => {});
        await updateSyncCount();
        return nextDocuments;
      }

              <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px;"><button class="auth-btn outline" id="profile-cancel" style="width:auto;margin:0;padding:10px 14px;">취소</button><button class="auth-btn primary" id="profile-save" style="width:auto;margin:0;padding:10px 14px;">저장</button></div>

        overlay.querySelectorAll(".profile-doc-remove").forEach((button) => {
          button.addEventListener("click", async () => {
            try {
              const documents = await removeProfileDocument(button.dataset.id);
              const saved = await saveDeviceProfile({ documents });
              setState({ user: saved });
              await queueSync("profile", saved);
              renderProfileModal();
              toast("문서를 이 기기에서 삭제했습니다.", "success");
            } catch (error) {
              toast(error instanceof Error ? error.message : "문서를 삭제하지 못했습니다.", "error");
            }
          });
        });
        overlay.querySelector("#profile-save")?.addEventListener("click", async () => {
          const saveButton = overlay.querySelector("#profile-save");
          const username = overlay.querySelector("#profile-name").value.trim();
          const avatarUrl = overlay.querySelector("#profile-avatar").value.trim();
          const bio = overlay.querySelector("#profile-bio").value.trim();
          const avatarFile = overlay.querySelector("#profile-image-file").files?.[0];
          const documentFiles = overlay.querySelector("#profile-doc-files").files;
          if (!username) {
            toast("표시 이름을 입력하세요.", "error");
            return;
          }
          if (avatarUrl && !/^https:\/\//i.test(avatarUrl)) {
            toast("아바타 URL은 HTTPS 주소여야 합니다.", "error");
            return;
          }
          saveButton.disabled = true;
          try {
            const avatarChanges = avatarFile ? await saveProfileAvatar(avatarFile) : {};
            const documents = documentFiles?.length ? await addProfileDocuments(documentFiles) : await getProfileDocuments();
            const saved = await saveDeviceProfile({
              username,
              // 업로드한 파일이 있으면 로컬 파일이 외부 URL보다 우선합니다.
              avatar: avatarFile ? "" : avatarUrl,
              bio,
              documents,
              ...avatarChanges,
            });
            setState({ user: saved });
            await queueSync("profile", saved);
            if (S.account?.connected) void flushSyncQueue();
            toast("프로필 이미지·문서를 이 기기에 저장했습니다.", "success");
            close();
          } catch (error) {
            toast(error instanceof Error ? error.message : "프로필을 저장하지 못했습니다.", "error", 5000);
          } finally {
            saveButton.disabled = false;
          }
        });
      }

          const key = overlay.querySelector("#account-key").value;

          }
        });

      // Messages render (incremental append)
      const _renderedMsgIds = new Set();
      function renderMessages() {
        const area = document.getElementById("messages-area");
        if (!area) return;
        const allMsgs = [...S.messages];
        if (S.streamingMsg)
          allMsgs.push({
            id: "__streaming__",
            conversation_id: S.currentConvId,
            role: "assistant",
            content: S.streamingMsg,
            created_at: new Date().toISOString(),
            _streaming: true,
          });

        if (allMsgs.length === 0) {
          area.innerHTML = renderEmptyState();
          _renderedMsgIds.clear();
          return;
        }

        // Ensure messages-inner exists
        let inner = document.getElementById("messages-inner");
        if (!inner || area.querySelector("#empty-state")) {
          area.innerHTML = '<div class="messages-inner" id="messages-inner"></div>';
          inner = document.getElementById("messages-inner");
          _renderedMsgIds.clear();
        }

        // Remove old streaming element
        const oldStream = inner.querySelector("[data-streaming]");
        if (oldStream && !S.streamingMsg) oldStream.remove();

        // Append new messages
        for (const msg of allMsgs) {
          if (_renderedMsgIds.has(msg.id)) {
            // Update streaming message
            if (msg.id === "__streaming__") {
              const el = inner.querySelector("[data-streaming]");
              if (el) {
                el.querySelector(".msg-text").textContent = msg.content;
              }
            }
            continue;
          }
          _renderedMsgIds.add(msg.id);
          const el = createMsgEl(msg);
          inner.appendChild(el);
          if (msg.localFileIds?.length > 0) loadMsgFiles(msg.id, el);
        }

        // Scroll to bottom
        area.scrollTop = area.scrollHeight;
      }

      function createMsgEl(msg) {
        const div = document.createElement("div");
        div.className = `message ${msg.role}`;
        div.setAttribute("data-mid", msg.id);
        if (msg._streaming) div.setAttribute("data-streaming", "1");
        const avatarClass = msg.role === "user" ? "user" : "assistant";
        const avatarIcon = msg.role === "user" ? iconSvg("User", 16) : iconSvg("Bot", 16);
        div.innerHTML = `<div class="message-inner">
          <div class="msg-avatar ${avatarClass}">${avatarIcon}</div>
          <div class="msg-body">
            <div class="msg-files" data-files-placeholder></div>
            <div class="msg-text">${escHtml(msg.content)}${msg._streaming ? '<span class="msg-cursor"></span>' : ""}</div>
          </div>
        </div>`;
        return div;
      }

      async function loadMsgFiles(msgId, msgEl) {
        const metas = await getMsgFileMetas(msgId);
        if (!metas.length) return;
        const fp = msgEl.querySelector("[data-files-placeholder]");
        if (!fp) return;
        fp.innerHTML = "";
        for (const meta of metas) {
          if (meta.type === "image") {
            const url = await createObjUrl(meta.id);
            if (url) {
              const d = document.createElement("div");
              d.className = "msg-img-thumb";
              const img = document.createElement("img");
              img.src = url;
              img.alt = meta.name;
              d.appendChild(img);
              fp.appendChild(d);
            }
          } else {
            const d = document.createElement("div");
            d.className = "msg-file-chip";
            d.innerHTML = `${iconSvg("FileText", 14)}<div><div class="fc-name">${escHtml(meta.name)}</div><div class="fc-size">${fmtSize(meta.size)}</div></div>`;
            fp.appendChild(d);
          }
        }
      }

      function renderFilePreviews() {
        const el = document.getElementById("file-previews");
        if (!el) return;
        el.innerHTML = "";
        for (const lf of S.attachedFiles) {
          const d = document.createElement("div");
          if (lf.previewUrl) {
            d.className = "fp-img";
            d.innerHTML = `<img src="${lf.previewUrl}" alt="${escHtml(lf.file.name)}">
              <div class="fp-img-name">${escHtml(lf.file.name)}</div>
              <button class="fp-remove" data-fid="${lf.id}">×</button>`;
          } else {
            d.className = "fp-chip";
            d.innerHTML = `${iconSvg("FileText", 14)}
              <div><div class="fp-chip-name">${escHtml(lf.file.name)}</div><div class="fp-chip-size">${fmtSize(lf.file.size)}</div></div>
              <button class="fp-remove" data-fid="${lf.id}" style="position:static;background:none;color:var(--text-muted)">×</button>`;

          d.querySelector("[data-fid]").addEventListener("click", () => {
            removeAttachedFile(lf.id);
          });
          el.appendChild(d);
        }
      }

      function removeAttachedFile(id) {
        const f = S.attachedFiles.find((x) => x.id === id);
        if (f?.previewUrl) URL.revokeObjectURL(f.previewUrl);
        setState({ attachedFiles: S.attachedFiles.filter((x) => x.id !== id) });
      }

        if (!bytes) return "";
        return bytes < 1024 * 1024 * 1024
          ? `${(bytes / 1024 / 1024).toFixed(1)}MB`
          : `${(bytes / 1024 / 1024 / 1024).toFixed(2)}GB`;
      }

      function renderGPTFileList() {
        const el = document.getElementById("gf-file-list");
        if (!el) return;
        el.innerHTML = "";
        if (gptModalFiles.length === 0) {
          el.innerHTML =
            '<div style="color:var(--text-dim);font-size:12px;padding:8px 4px;">첨부된 파일이 없습니다</div>';
          return;
        }
        for (let i = 0; i < gptModalFiles.length; i++) {
          const f = gptModalFiles[i];
          const isPending = f.isExisting && gptModalPendingDeletes.some((dd) => dd.id === f.id);
          const d = document.createElement("div");
          d.className = "file-list-item";
          d.style.opacity = isPending ? "0.45" : "1";
          d.style.textDecoration = isPending ? "line-through" : "none";
          const statusBadge = f.isExisting
            ? `<span style="font-size:10px;background:rgba(16,163,127,0.18);color:#10a37f;padding:2px 7px;border-radius:9999px;flex-shrink:0;">저장됨</span>`
            : `<span style="font-size:10px;background:rgba(59,130,246,0.18);color:#60a5fa;padding:2px 7px;border-radius:9999px;flex-shrink:0;">새파일</span>`;
          const delLabel = isPending ? "되돌리기" : "삭제";
          const delColor = isPending ? "var(--text-muted)" : "var(--danger)";
          const delIcon = isPending ? iconSvg("Plus", 14) : iconSvg("Trash2", 14);
          d.innerHTML = `${iconSvg("FileText", 16)}<div class="file-list-name">${escHtml(f.file_name)}</div>${statusBadge}<span class="file-list-size">${fmtSize(f.file_size)}</span><button class="file-list-del" data-idx="${i}" title="${delLabel}" style="color:${delColor}">${delIcon}</button>`;
          d.querySelector("[data-idx]").addEventListener("click", () => {
            const target = gptModalFiles[i];
            if (target && target.isExisting) {
              // 기존 DB 파일: 삭제 예정 토글
              const pIdx = gptModalPendingDeletes.findIndex((x) => x.id === target.id);
              if (pIdx >= 0) {
                gptModalPendingDeletes.splice(pIdx, 1);
              } else {
                gptModalPendingDeletes.push(target);
              }
            } else if (target) {
              // 새 파일: 즉시 목록에서 제거
              gptModalFiles.splice(i, 1);
            }
            renderGPTFileList();
          });
          el.appendChild(d);
        }
        if (gptModalPendingDeletes.length > 0) {
          const notice = document.createElement("div");
          notice.style.cssText = "font-size:11px;color:var(--danger);padding:6px 4px;margin-top:4px;";
          notice.textContent = `⚠️ ${gptModalPendingDeletes.length}개 파일이 '저장' 시 영구 삭제됩니다`;
          el.appendChild(notice);
        }
      }

      async function handleGPTFileUpload(e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const btn = document.getElementById("modal-save");
        if (btn) btn.disabled = true;
        for (const file of files) {
          try {
            const safe = file.name.replace(/[^a-zA-Z0-9._\-가-힣]/g, "_");
            const path = `${S.user.id}/gpt-files/${Date.now()}_${safe}`;
            const { data, error } = await sb.storage.from("chat-files").upload(path, file);
            if (error) {
              toast(`${file.name} 업로드 실패: ${error.message}`, "error");
              continue;
            }
            const { data: sd } = await sb.storage.from("chat-files").createSignedUrl(data.path, 60 * 60 * 24 * 365);
            let fc;
            try {
              fc = await file.text();
              if (fc.length > 50000) fc = fc.slice(0, 50000) + "\n...(생략)";
            } catch {}
            const TEXT_EXT2 = new Set([
              "txt",
              "md",
              "csv",
              "json",
              "log",
              "xml",
              "yaml",
              "yml",
              "ts",
              "tsx",
              "js",
              "jsx",
              "py",
              "css",
              "html",
              "sh",
              "env",
            ]);
            const ext = file.name.split(".").pop()?.toLowerCase() || "";
            if (!file.type.startsWith("text/") && !TEXT_EXT2.has(ext)) fc = undefined;
            gptModalFiles.push({
              id: crypto.randomUUID(),
              custom_gpt_id: "",
              file_name: file.name,
              file_url: sd?.signedUrl || "",
              file_path: data.path,
              file_size: file.size,
              mime_type: file.type || "application/octet-stream",
              file_content: fc,
              created_at: new Date().toISOString(),
            });
            toast(`${file.name} 업로드 완료`, "success");
          } catch (err) {
            toast(`${file.name}: ${err.message}`, "error");
          }
        }
        if (btn) btn.disabled = false;
        renderGPTFileList();
        if (e.target) e.target.value = "";
      }

      // ── BIND MAIN EVENTS ─────────────────────────────────────────
      function bindMain() {
        // New chat
        document.getElementById("btn-new-chat")?.addEventListener("click", () => {
          _renderedMsgIds.clear();
          setState({ currentConvId: null, messages: [], streamingMsg: "", currentGPT: null, currentGPTFiles: [] });
        });

        // Browser panel toggle (split view alongside chat)
        document.getElementById("btn-open-browser")?.addEventListener("click", () => {
          if (S.browserOpen) closeBrowserOverlay();
          else openBrowserOverlay();
        });

        // Sidebar drawer toggle (slide open/close)
        document.getElementById("btn-toggle-sidebar")?.addEventListener("click", () => {
          setState({ sidebarOpen: !S.sidebarOpen });
        });
        document.getElementById("sidebar-backdrop")?.addEventListener("click", () => {
          setState({ sidebarOpen: false });
        });

        // User dropdown
        document.getElementById("user-btn")?.addEventListener("click", (e) => {
          e.stopPropagation();
          setState({ dropdownOpen: !S.dropdownOpen });
        });
        document.addEventListener("click", () => {
          if (S.dropdownOpen) setState({ dropdownOpen: false });
        });
        document.getElementById("dd-profile")?.addEventListener("click", () => {
          setState({ dropdownOpen: false });
          renderProfileModal();
        });
        document.getElementById("dd-account")?.addEventListener("click", () => {
          setState({ dropdownOpen: false });
          void renderAccountModal();
        });
        document.getElementById("dd-sync")?.addEventListener("click", async () => {
          setState({ dropdownOpen: false });
          if (!S.account?.connected) {
            toast("계정 연결 전에도 모든 데이터는 이 기기에 저장됩니다. 계정을 연결하면 다른 기기와 동기화할 수 있습니다.", "info", 5000);
            return;
          }
          const ok = await flushSyncQueue();
          toast(ok ? "동기화를 완료했습니다." : "동기화 대기 항목이 남아 있습니다.", ok ? "success" : "info");
        });
        document.getElementById("dd-disconnect")?.addEventListener("click", disconnectAccount);
        document.getElementById("dd-local-model")?.addEventListener("click", () => {
          setState({ dropdownOpen: false });
          renderLocalModelModal();
        });

        // File attach
        document
          .getElementById("btn-attach")
          ?.addEventListener("click", () => document.getElementById("file-input").click());
        document.getElementById("file-input")?.addEventListener("change", (e) => {
          const files = Array.from(e.target.files || []);
          const maxFileCount = 10;
          const maxFileBytes = 10 * 1024 * 1024;
          const maxTotalBytes = 20 * 1024 * 1024;
          const available = Math.max(0, maxFileCount - S.attachedFiles.length);
          let totalBytes = S.attachedFiles.reduce((sum, item) => sum + item.file.size, 0);
          const accepted = [];

          for (const file of files.slice(0, available)) {
            if (!file.size) {
              toast(`빈 파일은 첨부할 수 없습니다: ${file.name}`, "error");
              continue;
            }
            if (file.size > maxFileBytes) {
              toast(`파일당 최대 10MB까지 첨부할 수 있습니다: ${file.name}`, "error");
              continue;
            }
            if (totalBytes + file.size > maxTotalBytes) {
              toast("전체 첨부 크기는 20MB까지입니다.", "error");
              break;
            }
            accepted.push(file);
            totalBytes += file.size;
          }
          if (files.length > available) toast("파일은 최대 10개까지 첨부할 수 있습니다.", "info");

          const newFiles = accepted.map((file) => ({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
            file,
            previewUrl: file.type.startsWith("image/") ? URL.createObjectURL(file) : undefined,
          }));
          if (newFiles.length) setState({ attachedFiles: [...S.attachedFiles, ...newFiles] });
          if (e.target) e.target.value = "";
        });

        // Send button
        document.getElementById("btn-send")?.addEventListener("click", doSend);

        // Textarea
        const ta = document.getElementById("msg-input");
        if (ta) {
          ta.addEventListener("keydown", (e) => {
            if (e.isComposing) return;
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              void doSend();
            }
          });
          ta.addEventListener("input", (e) => {
            const el = e.target;
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 180) + "px";
          });
        }

        // Close dropdown on outside click
        document.getElementById("content-area")?.addEventListener("click", () => {
          if (S.dropdownOpen) setState({ dropdownOpen: false });
        });
      }

      async function doSend() {
        const ta = document.getElementById("msg-input");
        const content = ta?.value || "";
        const files = S.attachedFiles.map((file) => file.file);
        if (!content.trim() && files.length === 0) return;

        const sent = await sendMessage(content, files);
        if (!sent) return;

        S.attachedFiles.forEach((file) => {
          if (file.previewUrl) URL.revokeObjectURL(file.previewUrl);
        });
        setState({ attachedFiles: [] });
        if (ta) {
          ta.value = "";
          ta.style.height = "auto";
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🔧  UTILS
      // ═══════════════════════════════════════════════════════════════
      function escHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function render() {
        if (S.loading) {
          document.getElementById("loading-screen").classList.remove("hidden");
          return;
        }
        document.getElementById("loading-screen").classList.add("hidden");
        if (S.view === "auth") {
          app.innerHTML = "";
          renderAuth();
          return;
        }
        // Check if we need full re-render
        if (!document.getElementById("main-layout")) {
          app.innerHTML = "";
          _renderedMsgIds.clear();
          renderMain();
          return;
        }
        // Targeted updates
        updateConvList();
        updateGPTSection();
        updateMessages();
        updateHeader();
        updateFilePreviews();
        updateLocalModelHint();
        updateGPTBanner();
        updateSidebarDrawer();
        if (S.gptBuilderOpen && !document.getElementById("gpt-modal")?.classList.contains("hidden") === false)
          renderGPTModal();
      }

      function updateConvList() {
        const el = document.getElementById("conv-list");
        if (!el) return;
        renderConvList();
      }
      function updateGPTSection() {
        const el = document.getElementById("gpt-section");
        if (!el) return;
        renderGPTSection();
      }
      function updateMessages() {
        renderMessages();
      }
      function updateFilePreviews() {
        renderFilePreviews();
      }
      function updateHeader() {
        const dd = document.getElementById("user-dropdown");
        if (dd) {
          dd.className = `dropdown ${S.dropdownOpen ? "open" : ""}`;
        }
        const bb = document.getElementById("btn-open-browser");
        if (bb) {
          bb.className = `browser-toggle-btn ${S.browserOpen ? "active" : ""}`;
        }
        const sb2 = document.getElementById("btn-toggle-sidebar");
        if (sb2) {
          sb2.className = `sidebar-toggle-btn ${S.sidebarOpen ? "active" : ""}`;
        }
      }
      function updateSidebarDrawer() {
        const sidebar = document.getElementById("sidebar");
        if (sidebar) sidebar.className = S.sidebarOpen ? "open" : "";
        const backdrop = document.getElementById("sidebar-backdrop");
        if (backdrop) backdrop.className = S.sidebarOpen ? "open" : "";
        // 안전장치: 일부 안드로이드 웹뷰는 z-index와 무관하게 iframe이 터치를 가로채는 버그가 있어
        // 사이드바가 열려 있는 동안은 브라우저 iframe의 터치 자체를 막아 먹통 현상을 방지한다.
        const iframe = document.getElementById("brow-iframe");
        if (iframe) iframe.style.pointerEvents = S.sidebarOpen ? "none" : "";
      }
      function updateGPTBanner() {
        const b = document.getElementById("gpt-banner");
        if (!b) return;
        if (S.currentGPT) {
          b.className = "visible";
          b.innerHTML = `<div class="gpt-banner-avatar">${S.currentGPT.avatar_url ? `<img src="${S.currentGPT.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : S.currentGPT.name[0] || "?"}</div><div><div style="font-weight:600;">${escHtml(S.currentGPT.name)}</div>${S.currentGPT.description ? `<div style="font-size:13px;color:rgba(255,255,255,0.6);">${escHtml(S.currentGPT.description)}</div>` : ""}</div>`;
        } else {
          b.className = "";
          b.innerHTML = "";
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🌐  ONLINE / OFFLINE
      // ═══════════════════════════════════════════════════════════════
      window.addEventListener("online", () => {
        setState({ isOnline: true, syncStatus: "연결 복구됨" });
        void flushSyncQueue();
        toast("인터넷에 연결되었습니다. 저장된 변경사항을 확인합니다.", "success");
      });
      window.addEventListener("offline", () => {
        setState({ isOnline: false, syncStatus: "오프라인 · 기기에 저장 중" });
        toast("오프라인 상태입니다", "error");
      });

      // ═══════════════════════════════════════════════════════════════
      // 🌐  브라우저 오버레이
      // ═══════════════════════════════════════════════════════════════
      const BROWSER_HOME_URL = "https://cdn-ai.onspace.ai/onspace/project/code/latest/9bhrqx-WLvYYqVECXEiiB6bW86hik-1786546216028052/index.html?_v=1786546222";

      function openBrowserOverlay() {
        const brow = document.getElementById("brow");
        const iframe = document.getElementById("brow-iframe");
        if (!brow || !iframe) return;
        if (!iframe.src || iframe.src === "about:blank") {
          iframe.src = BROWSER_HOME_URL;
        }
        brow.classList.add("open");
        setState({ browserOpen: true });
      }
      function closeBrowserOverlay() {
        const brow = document.getElementById("brow");
        brow?.classList.remove("open");
        // 수동으로 조절한 크기 초기화 → 다음에 열 때 기본 반반 비율로 시작
        if (brow) {
          brow.style.height = "";
          brow.style.width = "";
        }
        setState({ browserOpen: false });
      }
      const browserOrientationQuery = window.matchMedia("(orientation: landscape)");
      function bindBrowserOverlay() {
        document.getElementById("brow-back")?.addEventListener("click", closeBrowserOverlay);
        document.getElementById("brow-reload")?.addEventListener("click", () => {
          const iframe = document.getElementById("brow-iframe");
          if (iframe && iframe.src && iframe.src !== "about:blank") {
            iframe.src = iframe.src;
          }
        });
        document.getElementById("brow-newtab")?.addEventListener("click", () => {
          window.open(BROWSER_HOME_URL, "_blank", "noopener,noreferrer");
        });
        bindBrowserResize();
        // 화면 회전 시 수동 조절값을 지워서 세로=상하 반반 / 가로=좌우 반반 기본값으로 재적용
        browserOrientationQuery.addEventListener("change", () => {
          const brow = document.getElementById("brow");
          if (brow) {
            brow.style.height = "";
            brow.style.width = "";
          }
        });
      }

      // 드래그로 브라우저 패널 / 채팅 화면 분할 비율 조절
      // portrait(세로) = 위아래 드래그로 높이 조절, landscape(가로) = 좌우 드래그로 너비 조절
      function bindBrowserResize() {
        const handle = document.getElementById("brow-resize");
        const brow = document.getElementById("brow");
        if (!handle || !brow) return;
        let dragging = false;
        const apply = (clientX, clientY) => {
          if (browserOrientationQuery.matches) {
            const vw = window.innerWidth;
            const min = vw * 0.2;
            const max = vw * 0.8;
            const w = Math.max(min, Math.min(max, clientX));
            brow.style.width = w + "px";
          } else {
            const vh = window.innerHeight;
            const min = vh * 0.18;
            const max = vh * 0.8;
            const h = Math.max(min, Math.min(max, clientY));
            brow.style.height = h + "px";
          }
        };
        handle.addEventListener("pointerdown", (e) => {
          if (!brow.classList.contains("open")) return;
          dragging = true;
          brow.classList.add("resizing");
          handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          apply(e.clientX, e.clientY);
        });
        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          brow.classList.remove("resizing");
        };
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }

      // ═══════════════════════════════════════════════════════════════
      // 🚀  BOOT
      // ═══════════════════════════════════════════════════════════════
      (async () => {
        await supabaseReady; // anon key 해석 + Supabase 클라이언트 준비를 기다린다 (필요 시 입력폼 대기)
        bindBrowserOverlay();
        try {
          try {
            await Promise.all([
              blobStore.ready(),
              metaStore.ready(),
              msgFileStore.ready(),
              convStore.ready(),
              msgStore.ready(),
            ]);
          } catch (e) {
            console.warn("LocalForage init:", e);
          }

          await withTimeout(initAuth(), 6000, undefined);
          if (S.user) {
            await withTimeout(loadUserData(), 8000, undefined);
          }
        } catch (e) {
          console.warn("Boot error:", e);
        } finally {
          if (S.loading) setState({ loading: false, view: S.user ? "chat" : "auth" });
          render();
          document.getElementById("loading-screen").classList.add("hidden");
        }
      })();

      // PWA Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
