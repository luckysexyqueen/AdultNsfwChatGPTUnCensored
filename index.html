<head>

    <link rel="icon" type="image/png" href="/icon.png">

    <!-- Font Awesome (&#48652;&#46972;&#50864;&#51200; &#50724;&#48260;&#47112;&#51060; &#50500;&#51060;&#53080;&#50857;) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* ===== RESET & BASE ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background: #212121;
            color: #fff;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #app {
            flex: 1;
            min-height: 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* ===== VARIABLES ===== */
        :root {
            --bg: #212121;
            --bg2: #2f2f2f;
            --bg3: #343541;
            --bg4: #40414f;
            --border: rgba(255, 255, 255, 0.1);
            --accent: #10a37f;
            --accent-hover: #0d8968;
            --text: #fff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --text-dim: rgba(255, 255, 255, 0.25);
            --danger: #ef4444;
        }

        /* &#9472;&#9472; &#48652;&#46972;&#50864;&#51200; &#54056;&#45328; (&#52292;&#54021; &#54868;&#47732;&#44284; &#54637;&#49345; &#54632;&#44760; &#48372;&#51060;&#45716; &#48516;&#54624; &#54056;&#45328;) &#9472;&#9472;
         portrait(&#49464;&#47196;): &#50948;/&#50500;&#47000; &#48152;&#48152;, landscape(&#44032;&#47196;): &#51340;/&#50864; &#48152;&#48152; */
        #brow {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            /* portrait &#44592;&#48376;&#44050;: &#45236;&#50857; &#50948;, &#54648;&#46308; &#50500;&#47000; */
            width: 100%;
            height: 0;
            min-width: 0;
            min-height: 0;
            background: #0a0b0f;
            overflow: hidden;
            /* Firefox &#54840;&#54872;&#49457;: height: 0&#51068; &#46412; iframe &#47116;&#45908;&#47553;&#51060; &#47688;&#52628;&#45716; &#47928;&#51228;&#47484; &#48169;&#51648;&#54616;&#44592; &#50948;&#54644; visibility&#50752; opacity&#47484; &#54632;&#44760; &#49324;&#50857;&#54633;&#45768;&#45796;. */
            transition:
                height 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.28s,
                opacity 0.28s;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        #brow.open {
            height: 50vh;
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
            border-bottom: 1px solid #1e1f2e;
        }

        #brow.resizing {
            transition: none;
        }

        #brow-content {
            flex: 1;
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #brow-resize {
            flex-shrink: 0;
            height: 14px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: row-resize;
            background: #0e0f14;
            touch-action: none;
        }

        #brow-resize::after {
            content: "";
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: #3a3c4a;
        }

        /* landscape(&#44032;&#47196; &#47784;&#46300;): &#52292;&#54021;&#44284; &#48652;&#46972;&#50864;&#51200;&#47484; &#51340;&#50864;&#47196; &#48152;&#48152; &#48176;&#52824; */
        @media (orientation: landscape) {
            body {
                flex-direction: row;
            }

            #app {
                min-width: 0;
            }

            #brow {
                flex-direction: row;
                /* &#45236;&#50857; &#50812;&#51901;, &#54648;&#46308; &#50724;&#47480;&#51901; */
                width: 0;
                height: 100%;
                transition:
                    width 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                    visibility 0.28s,
                    opacity 0.28s;
                visibility: hidden;
                opacity: 0;
            }

            #brow.open {
                width: 50vw;
                height: 100%;
                visibility: visible;
                opacity: 1;
                border-bottom: none;
                border-right: 1px solid #1e1f2e;
            }

            #brow-resize {
                width: 14px;
                height: 100%;
                cursor: col-resize;
            }

            #brow-resize::after {
                width: 4px;
                height: 40px;
            }
        }

        #brow-tb {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #0e0f14;
            border-bottom: 1px solid #1e1f2e;
        }

        #brow-url {
            flex: 1;
            background: #16171f;
            border: 1px solid #2d2f3e;
            border-radius: 7px;
            padding: 5px 10px;
            font-size: 11px;
            color: #9ca3af;
            font-family: "JetBrains Mono", monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #brow-object {
            flex: 1;
            width: 100%;
            border: none;
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        /* ===== LAYOUT ===== */
        #main-layout {
            display: flex;
            height: 100%;
            overflow: hidden;
        }

        /* ===== SIDEBAR ===== */
        #sidebar {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 260px;
            min-width: 260px;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            z-index: 300;
            transform: translateX(-100%);
            transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 2px 0 24px rgba(0, 0, 0, 0.4);
        }

        #sidebar.open {
            transform: translateX(0);
        }

        #sidebar-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 290;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #sidebar-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }

        .sidebar-toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition:
                background 0.15s,
                border-color 0.15s;
        }

        .sidebar-toggle-btn:hover {
            background: var(--bg4);
        }

        .sidebar-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .sidebar-top {
            padding: 12px;
            border-bottom: 1px solid var(--border);
        }

        .btn-new-chat {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            cursor: pointer;
            font-size: 14px;
            transition: background 0.15s;
        }

        .btn-new-chat:hover {
            background: var(--bg3);
        }

        .sidebar-section {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .sidebar-label {
            font-size: 11px;
            color: var(--text-muted);
            padding: 8px 10px 4px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .conv-item:hover {
            background: var(--bg3);
        }

        .conv-item.active {
            background: var(--bg4);
        }

        .conv-item-title {
            flex: 1;
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item-del {
            opacity: 0;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            padding: 2px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .conv-item:hover .conv-item-del {
            opacity: 1;
        }

        /* GPT List */
        .gpt-section {
            border-bottom: 1px solid var(--border);
            padding: 8px;
        }

        .gpt-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 6px 10px;
        }

        .gpt-header-title {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-create-gpt {
            font-size: 12px;
            padding: 4px 10px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
        }

        .btn-create-gpt:hover {
            background: var(--accent-hover);
        }

        .gpt-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.15s;
            position: relative;
        }

        .gpt-item:hover {
            background: var(--bg3);
        }

        .gpt-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-weight: bold;
            font-size: 14px;
        }

        .gpt-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .gpt-info {
            flex: 1;
            min-width: 0;
        }

        .gpt-name {
            font-size: 13px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gpt-desc {
            font-size: 11px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .gpt-actions {
            display: none;
            gap: 2px;
        }

        .gpt-item:hover .gpt-actions {
            display: flex;
        }

        .gpt-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            display: flex;
            align-items: center;
        }

        .gpt-action-btn:hover {
            background: var(--bg4);
            color: var(--text);
        }

        .gpt-empty {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 16px 8px;
        }

        /* ===== HEADER ===== */
        #header {
            height: 56px;
            min-height: 56px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            background: var(--bg2);
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .guest-badge {
            font-size: 11px;
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
            padding: 2px 8px;
            border-radius: 9999px;
        }

        .header-right {
            position: relative;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .browser-toggle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: #fff;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition:
                background 0.15s,
                border-color 0.15s;
        }

        .browser-toggle-btn:hover {
            background: var(--bg4);
        }

        .browser-toggle-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        .user-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--accent);
            border: none;
            color: white;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dropdown {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 10px;
            min-width: 200px;
            overflow: hidden;
            z-index: 100;
            display: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        .dropdown.open {
            display: block;
        }

        .dropdown-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
        }

        .dropdown-user-name {
            font-size: 13px;
            font-weight: 500;
        }

        .dropdown-user-email {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s;
        }

        .dropdown-item:hover {
            background: var(--bg4);
        }

        .dropdown-item.danger {
            color: var(--danger);
        }

        .dropdown-sep {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* ===== GPT BANNER ===== */
        #gpt-banner {
            background: linear-gradient(to right, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
            border-bottom: 1px solid var(--border);
            padding: 10px 24px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        #gpt-banner.visible {
            display: flex;
        }

        .gpt-banner-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 13px;
            flex-shrink: 0;
        }

        /* ===== CHAT AREA ===== */
        #content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #messages-area {
            flex: 1;
            overflow-y: auto;
        }

        .messages-inner {
            padding-bottom: 16px;
        }

        /* Empty state */
        #empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px 20px;
            text-align: center;
        }

        .empty-logo {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-sub {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Message */
        .message {
            padding: 20px 16px;
        }

        .message.assistant {
            background: rgba(255, 255, 255, 0.03);
        }

        .message-inner {
            max-width: 720px;
            margin: 0 auto;
            display: flex;
            gap: 14px;
        }

        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .msg-avatar.user {
            background: var(--accent);
        }

        .msg-avatar.assistant {
            background: var(--bg4);
        }

        .msg-body {
            flex: 1;
            min-width: 0;
            padding-top: 4px;
        }

        .msg-text {
            font-size: 15px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
            color: var(--text);
        }

        .msg-cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--text);
            border-radius: 2px;
            margin-left: 3px;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* File attachments in messages */
        .msg-files {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .msg-img-thumb {
            max-width: 280px;
            max-height: 200px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .msg-img-thumb img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .msg-file-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 12px;
            max-width: 220px;
        }

        .msg-file-chip .fc-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .msg-file-chip .fc-size {
            color: var(--text-muted);
            font-size: 10px;
            margin-top: 1px;
        }

        /* ===== CHAT INPUT ===== */
        #chat-input-area {
            border-top: 1px solid var(--border);
            background: var(--bg);
            padding: 12px 16px 14px;
        }

        .input-wrap {
            max-width: 720px;
            margin: 0 auto;
        }

        #file-previews {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .fp-img {
            position: relative;
            width: 76px;
            height: 76px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .fp-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .fp-img-name {
            position: absolute;
            bottom: 0;
            inset-x: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
            font-size: 9px;
            padding: 4px 3px 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fp-chip {
            display: flex;
            align-items: center;
            gap: 7px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 6px 10px;
            max-width: 190px;
        }

        .fp-chip-name {
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fp-chip-size {
            font-size: 9px;
            color: var(--text-muted);
        }

        .fp-remove {
            background: rgba(0, 0, 0, 0.6);
            border: none;
            color: #fff;
            cursor: pointer;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 3px;
            right: 3px;
            font-size: 10px;
        }

        .fp-chip .fp-remove {
            position: static;
            background: none;
            color: var(--text-muted);
            font-size: 12px;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: var(--bg2);
            border-radius: 14px;
            border: 1px solid var(--border);
            padding: 10px 14px;
        }

        .input-box-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2px;
            border-radius: 6px;
            transition: color 0.15s;
            flex-shrink: 0;
            margin-bottom: 2px;
        }

        .input-box-btn:hover {
            color: var(--text);

        // &#128230;  LOCALFORAGE STORES (&#54028;&#51068; &#50689;&#44396; &#51200;&#51109;) &mdash; CDN &#49892;&#54056; &#45824;&#48708; &#54260;&#48177; &#54252;&#54632;

        function makeStore(opts) {

        function fileType(file) {
            if (file.type.startsWith("image/")) return "image";

        async function storeFileLF(file, ctx = {}) {

        function mapUser(u) {

                        resolve(fallback);
                    }

                    (v) => {

                            resolve(v);
                        }

                    () => {

                            clearTimeout(timer);
                            resolve(fallback);

                    .from("custom_gpts")
                    .select("*")

        // &#128172;  CHAT
        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
        async function processFiles(files, convId) {
            const attachments = [];
            for (const file of files) {
                try {
                    const meta = await storeFileLF(file, {
                        conversationId: convId
                    });
                    if (meta.type === "image") {
                        if (!navigator.onLine) {
                            const b64 = await fileToBase64(meta.id);
                            if (b64)
                                attachments.push({
                                    name: file.name,
                                    mimeType: file.type,
                                    type: "image",
                                    base64: b64,
                                    localId: meta.id,
                                });
                        } else {
                            const safe = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
                            const path = `${S.user.id}/chat/${Date.now()}_${safe}`;
                            const {
                                data,
                                error
                            } = await sb.storage.from("chat-files").upload(path, file);
                            if (error) {
                                const b64 = await fileToBase64(meta.id);
                                if (b64)
                                    attachments.push({
                                        name: file.name,
                                        mimeType: file.type,
                                        type: "image",
                                        base64: b64,
                                        localId: meta.id,
                                    });
                            } else {
                                const {
                                    data: s
                                } = await sb.storage.from("chat-files").createSignedUrl(data.path, 3600);
                                attachments.push({
                                    name: file.name,
                                    mimeType: file.type,
                                    type: "image",
                                    url: s?.signedUrl,
                                    localId: meta.id,
                                });
                            }
                        }
                    } else if (meta.type === "text") {
                        attachments.push({
                            name: file.name,
                            mimeType: file.type,
                            type: "text",
                            textContent: meta.textContent,
                            localId: meta.id,
                        });
                    } else {
                        attachments.push({
                            name: file.name,
                            mimeType: file.type,
                            type: "other",
                            localId: meta.id
                        });
                    }
                } catch (e) {
                    console.error(e);
                    toast(`&#54028;&#51068; &#52376;&#47532; &#49892;&#54056;: ${file.name}`, "error");
                }
            }
            return attachments;
        }

        async function sendMessage(content, filesToSend = []) {
            if (!S.user) return;
            const trimmed = content.trim();
            if (!trimmed && filesToSend.length === 0) return;
            if (S.isStreaming) return;
            if (!S.isOnline) {
                toast("&#50724;&#54532;&#46972;&#51064; &#49345;&#53468;&#51077;&#45768;&#45796;", "error");
                return;
            }

            let convId = S.currentConvId;
            let savedMsgId = null;
            const tempId = `temp-${Date.now()}`;
            const isGuest = false;

            // Determine system prompt / instructions
            let sysPrompt = S.currentGPT?.system_prompt;
            let instructions = S.currentGPT?.instructions;
            if (convId && !S.currentGPT) {
                const cv = S.conversations.find((c) => c.id === convId);
                if (cv) {
                    sysPrompt = cv.system_prompt;
                    instructions = cv.instructions;
                }
            }

            // Create conversation if needed
            if (!convId) {
                const title = trimmed.slice(0, 50) || filesToSend[0]?.name || "&#49352; &#45824;&#54868;";
                if (isGuest) {
                    const nc = {
                        id: `local-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
                        user_id: S.user.id,
                        title,
                        custom_gpt_id: S.currentGPT?.id || null,
                        system_prompt: sysPrompt || "",
                        instructions: instructions || "",
                        created_at: new Date().toISOString(),
                        updated_at: new Date().toISOString(),
                    };
                    convId = nc.id;
                    setState({
                        conversations: [nc, ...S.conversations],
                        currentConvId: convId
                    });
                    await cacheConv(nc).catch(() => {});
                } else {
                    const {
                        data,
                        error
                    } = await sb
                        .from("conversations")
                        .insert({
                            user_id: S.user.id,
                            title,
                            custom_gpt_id: S.currentGPT?.id || null,
                            system_prompt: sysPrompt || "",
                            instructions: instructions || "",
                        })
                        .select()
                        .single();
                    if (error) {
                        toast("&#45824;&#54868; &#49373;&#49457; &#49892;&#54056;", "error");
                        return;
                    }
                    convId = data.id;
                    setState({
                        conversations: [data, ...S.conversations],
                        currentConvId: convId
                    });
                    await cacheConv(data).catch(() => {});
                }
            }

            // Process files
            let chatAttachments = [];
            if (filesToSend.length > 0) {
                chatAttachments = await processFiles(filesToSend, convId);
            }
            const localFileIds = chatAttachments.map((a) => a.localId).filter(Boolean);

            // Build display content
            const imgCnt = chatAttachments.filter((a) => a.type === "image").length;
            const displayContent = trimmed || (imgCnt > 0 ? `&#128247; &#51060;&#48120;&#51648; ${imgCnt}&#44060;` : `&#128206; &#54028;&#51068; ${filesToSend.length}&#44060;`);

            const userMsg = {
                id: tempId,
                conversation_id: convId,
                role: "user",
                content: displayContent,
                created_at: new Date().toISOString(),
                localFileIds: localFileIds.length > 0 ? localFileIds : undefined,
            };
            const currentMsgs = [...S.messages, userMsg];
            setState({
                messages: currentMsgs,
                isStreaming: true,
                streamingMsg: "",
                attachedFiles: []
            });

            // Save user message
            if (isGuest) {
                savedMsgId = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
                const savedMsg = {
                    ...userMsg,
                    id: savedMsgId
                };
                await cacheMsgLF(savedMsg).catch(() => {});
                setState({
                    messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m))
                });
            } else {
                const {
                    data,
                    error
                } = await sb
                    .from("messages")
                    .insert({
                        conversation_id: convId,
                        role: "user",
                        content: displayContent
                    })
                    .select()
                    .single();
                if (!error) {
                    savedMsgId = data.id;
                    const savedMsg = {
                        ...data,
                        localFileIds: localFileIds.length > 0 ? localFileIds : undefined
                    };
                    await cacheMsgLF(savedMsg).catch(() => {});
                    setState({
                        messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m))
                    });
                }
            }

            // Link files to message
            if (localFileIds.length > 0 && savedMsgId) {
                await setMsgFiles(savedMsgId, localFileIds).catch(() => {});
            }

            // Stream from AI
            try {
                const {
                    data: {
                        session
                    },
                } = await sb.auth.getSession();
                const token = session?.access_token || (isGuest ? "guest-token" : "anon");
                const resp = await fetch(EDGE_FUNCTION_URL, {
                    method: "POST",
                    headers: {
                        Authorization: `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: currentMsgs.map((m) => ({
                            role: m.role,
                            content: m.content
                        })),
                        systemPrompt: sysPrompt,
                        instructions,
                        gptFiles: S.currentGPTFiles.length > 0 ? S.currentGPTFiles : undefined,
                        chatAttachments: chatAttachments.length > 0 ? chatAttachments : undefined,
                        lastUserContent: trimmed,
                    }),
                });

                if (!resp.ok) {
                    let errMsg = "AI &#51025;&#45813; &#49892;&#54056;";
                    try {
                        const t = await resp.text();
                        try {
                            const j = JSON.parse(t);
                            errMsg = j.error || j.message || errMsg;
                        } catch {
                            errMsg = t.slice(0, 150) || errMsg;
                        }
                    } catch {}
                    if (resp.status === 402) errMsg = "AI &#49436;&#48708;&#49828; &#53356;&#47112;&#46375;&#51060; &#48512;&#51313;&#54633;&#45768;&#45796;. &#44288;&#47532;&#51088;&#50640;&#44172; &#47928;&#51032;&#54616;&#49464;&#50836;";
                    else if (resp.status === 429) errMsg = "&#50836;&#52397;&#51060; &#45320;&#47924; &#47566;&#49845;&#45768;&#45796;. &#51104;&#49884; &#54980; &#45796;&#49884; &#49884;&#46020;&#54644;&#51452;&#49464;&#50836;";
                    else if (resp.status >= 500) errMsg = "&#49436;&#48260; &#50724;&#47448;&#44032; &#48156;&#49373;&#54664;&#49845;&#45768;&#45796;. &#51104;&#49884; &#54980; &#45796;&#49884; &#49884;&#46020;&#54644;&#51452;&#49464;&#50836;";
                    throw new Error(errMsg);
                }

                const reader = resp.body.getReader();
                const dec = new TextDecoder();
                let full = "",
                    buf = "";
                while (true) {
                    const {
                        done,
                        value
                    } = await reader.read();
                    if (done) break;
                    buf += dec.decode(value, {
                        stream: true
                    });
                    const lines = buf.split("\n");
                    buf = lines.pop() || "";
                    for (const line of lines) {
                        if (!line.includes("data:")) continue;
                        const js = line.replace(/^data:\s*/, "").trim();
                        if (js === "[DONE]") continue;
                        try {
                            const p = JSON.parse(js);
                            const d = p.choices?.[0]?.delta?.content || "";
                            if (d) {
                                full += d;
                                setState({
                                    streamingMsg: full
                                });
                            }
                        } catch {}
                    }
                }

                if (!full.trim()) throw new Error("AI&#44032; &#51025;&#45813;&#51012; &#49373;&#49457;&#54616;&#51648; &#47803;&#54664;&#49845;&#45768;&#45796;");

                // Save AI response
                const aiMsgBase = {
                    id: `tmp-${Date.now()}`,
                    conversation_id: convId,
                    role: "assistant",
                    content: full,
                    created_at: new Date().toISOString(),
                };
                if (isGuest) {
                    aiMsgBase.id = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
                    setState({
                        messages: [...S.messages, aiMsgBase],
                        streamingMsg: "",
                        isStreaming: false
                    });
                    await cacheMsgLF(aiMsgBase).catch(() => {});
                } else {
                    const {
                        data,
                        error
                    } = await sb
                        .from("messages")
                        .insert({
                            conversation_id: convId,
                            role: "assistant",
                            content: full
                        })
                        .select()
                        .single();
                    const finalMsg = error ? aiMsgBase : {
                        ...data
                    };
                    setState({
                        messages: [...S.messages, finalMsg],
                        streamingMsg: "",
                        isStreaming: false
                    });
                    if (!error) await cacheMsgLF(finalMsg).catch(() => {});
                }

                // Update conversation title on first message
                if (currentMsgs.length === 1) {
                    const newTitle = trimmed.slice(0, 50) || displayContent.slice(0, 50);
                    if (!isGuest) {
                        sb.from("conversations")
                            .update({
                                title: newTitle,
                                updated_at: new Date().toISOString()
                            })
                            .eq("id", convId)
                            .then(() => {});
                    }
                    setState({
                        conversations: S.conversations.map((c) =>
                            c.id === convId ? {
                                ...c,
                                title: newTitle,
                                updated_at: new Date().toISOString()
                            } : c,
                        ),
                    });
                }
            } catch (err) {
                console.error("sendMessage error:", err);
                setState({
                    isStreaming: false,
                    streamingMsg: ""
                });
                if (!savedMsgId) setState({
                    messages: S.messages.filter((m) => m.id !== tempId)
                });
                toast(err.message || "&#47700;&#49884;&#51648; &#51204;&#49569;&#50640; &#49892;&#54056;&#54664;&#49845;&#45768;&#45796;", "error");
            }
        }

        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;

        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
        // &#128444;&#65039;  RENDER
        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
        const app = document.getElementById("app");

        // &#9472;&#9472; AUTH PAGE &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
        let authState = {
            isLogin: true,
            email: "",
            pw: "",
            otp: "",

        function renderAuth() {
            app.innerHTML = `
  <div id="auth-page">
    <div class="auth-card">
      <div class="auth-logo">${iconSvg("MessageSquare", 24)}
      <div class="auth-title" id="auth-title">${authState.isLogin ? "&#47196;&#44536;&#51064;" : "&#54924;&#50896;&#44032;&#51077;"}

      <div id="auth-extra">

        function renderAuthExtra() {
            const el = document.getElementById("auth-extra");
            if (!el) return;
            if (authState.isLogin) {
                el.innerHTML = `
      <input class="auth-input" type="password" id="auth-pw" placeholder="&#48708;&#48128;&#48264;&#54840;" value="${authState.pw}" ${authState.loading ? "disabled" : ""}>
      <button class="auth-btn primary" id="btn-login" ${authState.loading ? "disabled" : ""}>
        ${authState.loading ? "&#47196;&#44536;&#51064; &#51473;..." : "&#47196;&#44536;&#51064;"}
      `;
                el.querySelector("#auth-pw").addEventListener("input", (e) => {
                    authState.pw = e.target.value;
                });
                el.querySelector("#btn-login").addEventListener("click", doLogin);
            } else if (!authState.otpSent) {
                el.innerHTML = `<button class="auth-btn primary" id="btn-otp" ${authState.loading ? "disabled" : ""}>
      ${authState.loading ? "&#51204;&#49569; &#51473;..." : "&#51064;&#51613; &#53076;&#46300; &#48155;&#44592;"}
    `;
                el.querySelector("#btn-otp").addEventListener("click", doSendOtp);
            } else {
                el.innerHTML = `
      <input class="auth-input" placeholder="&#51064;&#51613; &#53076;&#46300; (4&#51088;&#47532;)" id="auth-otp" maxlength="4" value="${authState.otp}" ${authState.loading ? "disabled" : ""}>
      <input class="auth-input" type="password" id="auth-pw2" placeholder="&#48708;&#48128;&#48264;&#54840; &#49444;&#51221;" value="${authState.pw}" ${authState.loading ? "disabled" : ""}>
      <button class="auth-btn primary" id="btn-register" ${authState.loading ? "disabled" : ""}>
        ${authState.loading ? "&#44032;&#51077; &#51473;..." : "&#54924;&#50896;&#44032;&#51077; &#50756;&#47308;"}
      `;
                el.querySelector("#auth-otp").addEventListener("input", (e) => {
                    authState.otp = e.target.value;
                });
                el.querySelector("#auth-pw2").addEventListener("input", (e) => {
                    authState.pw = e.target.value;
                });
                el.querySelector("#btn-register").addEventListener("click", doRegister);
            }
        }

        function bindAuth() {
            document.getElementById("auth-email")?.addEventListener("input", (e) => {
                authState.email = e.target.value;
            });
            document.getElementById("auth-switch")?.addEventListener("click", () => {
                authState.isLogin = !authState.isLogin;
                authState.otpSent = false;
                authState.otp = "";
                renderAuth();
            });
        }

        async function doSendOtp() {
            authState.loading = true;
            renderAuthExtra();
            const {
                error
            } = await sb.auth.signInWithOtp({
                email: authState.email,
                options: {
                    shouldCreateUser: true
                }
            });
            authState.loading = false;
            if (error) {
                toast(error.message, "error");
                renderAuthExtra();
                return;
            }
            authState.otpSent = true;
            toast("&#51064;&#51613; &#53076;&#46300;&#44032; &#51060;&#47700;&#51068;&#47196; &#51204;&#49569;&#46104;&#50632;&#49845;&#45768;&#45796;", "success");
            renderAuthExtra();
        }

        async function doRegister() {
            authState.loading = true;
            renderAuthExtra();
            const {
                data,
                error
            } = await sb.auth.verifyOtp({
                email: authState.email,
                token: authState.otp,
                type: "email",
            });
            if (error) {
                authState.loading = false;
                toast(error.message, "error");
                renderAuthExtra();
                return;
            }
            const {
                error: ue
            } = await sb.auth.updateUser({
                password: authState.pw,
                data: {
                    username: authState.email.split("@")[0]
                },
            });
            if (ue) {
                authState.loading = false;
                toast(ue.message, "error");
                renderAuthExtra();
                return;
            }
            setState({
                user: mapUser(data.user),
                view: "chat"
            });
            authState.loading = false;
            await loadUserData();
        }

        async function doLogin() {
            authState.loading = true;
            renderAuthExtra();
            const {
                data,
                error
            } = await sb.auth.signInWithPassword({
                email: authState.email,
                password: authState.pw
            });
            if (error) {
                authState.loading = false;
                toast(error.message, "error");
                renderAuthExtra();
                return;
            }
            setState({
                user: mapUser(data.user),
                view: "chat"
            });
            authState.loading = false;
            await loadUserData();
        }

        // &#9472;&#9472; MAIN LAYOUT &#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;&#9472;
        function renderMain() {
            app.innerHTML = `
  <div id="sidebar-backdrop" class="${S.sidebarOpen ? "open" : ""}">
  <div id="main-layout">
    <div id="sidebar" class="${S.sidebarOpen ? "open" : ""}">
      <div class="sidebar-top" style="display:flex;flex-direction:column;gap:8px;">
        <button class="btn-new-chat" id="btn-new-chat">
          ${iconSvg("Plus", 16)} &#49352; &#52292;&#54021;
        
      
      <div id="gpt-section" class="gpt-section">
      <div class="sidebar-section" id="conv-list">
        <div class="sidebar-label">&#52572;&#44540; &#45824;&#54868;
      
    
    <div id="content-area">

        <div class="header-title" style="display:flex;align-items:center;gap:12px;">
          <button class="sidebar-toggle-btn ${S.sidebarOpen ? "active" : ""}" id="btn-toggle-sidebar" title="&#49324;&#51060;&#46300;&#48148; &#50676;&#44592;/&#45803;&#44592;">
            &#9776;
          
          <span style="display:flex;align-items:center;gap:10px;">${iconSvg("MessageSquare", 20)} AI Chat
        
        <div class="header-right">
          <button class="browser-toggle-btn ${S.browserOpen ? "active" : ""}" id="btn-open-browser" title="&#48652;&#46972;&#50864;&#51200; &#50676;&#44592;/&#45803;&#44592;">
            &#127760;
          
          <button class="user-btn" id="user-btn" title="${S.user?.username || ""}">
            ${S.user?.avatar ? `<img src="${S.user.avatar}" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">` : (S.user?.username || "?").charAt(0).toUpperCase()}
          
          <div class="dropdown ${S.dropdownOpen ? "open" : ""}" id="user-dropdown">
            <div class="dropdown-header">
              <div class="dropdown-user-name">${S.user?.username || ""}
              <div class="dropdown-user-email">${S.user?.email || ""}
            
            <div class="dropdown-item" id="dd-queue">${iconSvg("MessageSquarePlus", 14)} &#45824;&#44592; &#47700;&#49884;&#51648; &#51204;&#49569;
            <div class="dropdown-sep">
            <div class="dropdown-item danger" id="dd-logout">${iconSvg("LogOut", 14)} &#47196;&#44536;&#50500;&#50883;
          
        
      
      <div id="gpt-banner" class="${S.currentGPT ? "visible" : ""}">
        ${
          S.currentGPT
            ? `
          <div class="gpt-banner-avatar">
            ${S.currentGPT.avatar_url ? `<img src="${S.currentGPT.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : S.currentGPT.name[0] || "?"}
          
          <div>
            <div style="font-weight:600;">${S.currentGPT.name}
            ${S.currentGPT.description ? `<div style="font-size:13px;color:rgba(255,255,255,0.6);">${S.currentGPT.description}` : ""}
          `
            : ""
        }
      
      <div id="messages-area">
        ${S.messages.length === 0 && !S.currentConvId ? renderEmptyState() : '<div class="messages-inner" id="messages-inner">'}
      
      <div id="chat-input-area">
        <div class="input-wrap">
          <div id="file-previews">
          <div class="input-box">
            <button class="input-box-btn" id="btn-attach" title="&#54028;&#51068; &#52392;&#48512;" ${S.isStreaming ? "disabled" : ""}>
              ${iconSvg("Paperclip", 20)}
            
            <input type="file" id="file-input" multiple style="display:none;">
            <textarea id="msg-input" rows="1"
              placeholder="${S.attachedFiles.length > 0 ? "&#54028;&#51068;&#50640; &#45824;&#54644; &#51656;&#47928;&#54616;&#44144;&#45208; Enter&#47196; &#51204;&#49569;..." : "&#47700;&#49884;&#51648;&#47484; &#51077;&#47141;&#54616;&#49464;&#50836;..."}"
              ${S.isStreaming ? "disabled" : ""}
              style="height:auto;min-height:24px;">
            <button class="send-btn" id="btn-send" ${S.isStreaming ? "disabled" : ""} title="&#51204;&#49569;">
              ${iconSvg("Send", 15)}
            
          
          <div class="input-hint">&#51060;&#48120;&#51648;&middot;PDF&middot;&#53581;&#49828;&#53944; &#46321; &#47784;&#46304; &#54028;&#51068; &#52392;&#48512; &#51648;&#50896; &middot; Enter&#47196; &#51204;&#49569;, Shift+Enter&#47196; &#51460;&#48148;&#45000;
        
      
    
  
  <div class="modal-overlay hidden" id="gpt-modal">
  `;

            renderConvList();
            renderGPTSection();
            renderMessages();
            renderFilePreviews();
            bindMain();
            if (S.gptBuilderOpen) renderGPTModal();
        }

        function renderEmptyState() {
            return `<div id="empty-state">
    <div class="empty-logo">${iconSvg("MessageSquare", 28)}
    <div class="empty-title">&#47924;&#50631;&#51060;&#46304; &#47932;&#50612;&#48372;&#49464;&#50836;
    <div class="empty-sub">AI&#50752; &#51088;&#50976;&#47213;&#44172; &#45824;&#54868;&#54616;&#49464;&#50836;. &#51060;&#48120;&#51648;&#50752; &#54028;&#51068;&#46020; &#52392;&#48512;&#54624; &#49688; &#51080;&#49845;&#45768;&#45796;.
  `;
        }

        function renderConvList() {
            const el = document.getElementById("conv-list");
            if (!el) return;
            let html = `<div class="sidebar-label">&#52572;&#44540; &#45824;&#54868;`;
            if (S.conversations.length === 0) {
                html += `<div style="text-align:center;color:var(--text-muted);font-size:12px;padding:16px 8px;">&#50500;&#51649; &#45824;&#54868;&#44032; &#50630;&#49845;&#45768;&#45796;`;
            }
            for (const cv of S.conversations) {
                html += `<div class="conv-item ${S.currentConvId === cv.id ? "active" : ""}" data-cid="${cv.id}">
      ${iconSvg("MessageSquare", 14)}
      <span class="conv-item-title">${escHtml(cv.title || "&#49352; &#45824;&#54868;")}
      <button class="conv-item-del" data-del="${cv.id}" title="&#49325;&#51228;">${iconSvg("Trash2", 13)}
    `;
            }
            el.innerHTML = html;
            el.querySelectorAll(".conv-item").forEach((item) => {
                item.addEventListener("click", (e) => {
                    if (e.target.closest("[data-del]")) return;
                    const cid = item.dataset.cid;
                    setState({
                        currentConvId: cid
                    });
                    loadMessages(cid);
                });
            });
            el.querySelectorAll("[data-del]").forEach((btn) => {
                btn.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteConv(btn.dataset.del);
                });
            });
        }

        function renderGPTSection() {
            const el = document.getElementById("gpt-section");
            if (!el) return;
            let html = `<div class="gpt-header">
    <span class="gpt-header-title">${iconSvg("Bot", 16)} &#52964;&#49828;&#53568; GPT
    <button class="btn-create-gpt" id="btn-create-gpt">+ &#47564;&#46308;&#44592;
  `;
            if (S.customGPTs.length === 0) {
                html += `<div class="gpt-empty">&#50500;&#51649; &#52964;&#49828;&#53568; GPT&#44032; &#50630;&#49845;&#45768;&#45796;<br>&#50948; &#48260;&#53948;&#51012; &#45580;&#47084; &#47564;&#46308;&#50612;&#48372;&#49464;&#50836;!`;
            } else {
                for (const g of S.customGPTs) {
                    html += `<div class="gpt-item" data-gid="${g.id}">
        <div class="gpt-avatar">${g.avatar_url ? `<img src="${g.avatar_url}" alt="${escHtml(g.name)}">` : g.name[0] || "?"}
        <div class="gpt-info">
          <div class="gpt-name">${escHtml(g.name)}
          ${g.description ? `<div class="gpt-desc">${escHtml(g.description)}` : ""}
        
        <div class="gpt-actions">
          <button class="gpt-action-btn" data-gpt-chat="${g.id}" title="&#45824;&#54868; &#49884;&#51089;">${iconSvg("MessageSquarePlus", 14)}
          <button class="gpt-action-btn" data-gpt-edit="${g.id}" title="&#49688;&#51221;">${iconSvg("Edit2", 14)}
          <button class="gpt-action-btn" data-gpt-del="${g.id}" title="&#49325;&#51228;" style="color:var(--danger)">${iconSvg("Trash2", 14)}
        
      `;
                }
            }
            el.innerHTML = html;
            document.getElementById("btn-create-gpt")?.addEventListener("click", () => {
                gptBuilderFiles = [];
                setState({
                    gptBuilderOpen: true,
                    gptBuilderEditing: null
                });
                renderGPTModal();
            });
            el.querySelectorAll("[data-gpt-chat]").forEach((b) =>
                b.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const g = S.customGPTs.find((x) => x.id === b.dataset.gptChat);
                    if (g) startGPTChat(g);
                }),
            );
            el.querySelectorAll("[data-gpt-edit]").forEach((b) =>
                b.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const g = S.customGPTs.find((x) => x.id === b.dataset.gptEdit);
                    if (g) {
                        gptBuilderFiles = [];
                        setState({
                            gptBuilderOpen: true,
                            gptBuilderEditing: g
                        });
                        renderGPTModal();
                    }
                }),
            );
            el.querySelectorAll("[data-gpt-del]").forEach((b) =>
                b.addEventListener("click", (e) => {
                    e.stopPropagation();
                    deleteGPT(b.dataset.gptDel);
                }),
            );
            el.querySelectorAll(".gpt-item").forEach((item) => {
                item.addEventListener("click", () => {
                    const g = S.customGPTs.find((x) => x.id === item.dataset.gid);
                    if (g) startGPTChat(g);
                });
            });
        }

        // Messages render (incremental append)
        const _renderedMsgIds = new Set();

        function renderMessages() {
            const area = document.getElementById("messages-area");
            if (!area) return;
            const allMsgs = [...S.messages];
            if (S.streamingMsg)
                allMsgs.push({
                    id: "__streaming__",
                    conversation_id: S.currentConvId,
                    role: "assistant",
                    content: S.streamingMsg,
                    created_at: new Date().toISOString(),
                    _streaming: true,
                });

            if (allMsgs.length === 0) {
                area.innerHTML = renderEmptyState();
                _renderedMsgIds.clear();
                return;
            }

            // Ensure messages-inner exists
            let inner = document.getElementById("messages-inner");
            if (!inner || area.querySelector("#empty-state")) {
                area.innerHTML = '<div class="messages-inner" id="messages-inner">';
                inner = document.getElementById("messages-inner");
                _renderedMsgIds.clear();
            }

            // Remove old streaming element
            const oldStream = inner.querySelector("[data-streaming]");
            if (oldStream && !S.streamingMsg) oldStream.remove();

            // Append new messages
            for (const msg of allMsgs) {
                if (_renderedMsgIds.has(msg.id)) {
                    // Update streaming message
                    if (msg.id === "__streaming__") {
                        const el = inner.querySelector("[data-streaming]");
                        if (el) {
                            el.querySelector(".msg-text").textContent = msg.content;
                        }
                    }
                    continue;
                }
                _renderedMsgIds.add(msg.id);
                const el = createMsgEl(msg);
                inner.appendChild(el);
                if (msg.localFileIds?.length > 0) loadMsgFiles(msg.id, el);
            }

            // Scroll to bottom
            area.scrollTop = area.scrollHeight;
        }

        function createMsgEl(msg) {
            const div = document.createElement("div");
            div.className = `message ${msg.role}`;
            div.setAttribute("data-mid", msg.id);
            if (msg._streaming) div.setAttribute("data-streaming", "1");
            const avatarClass = msg.role === "user" ? "user" : "assistant";
            const avatarIcon = msg.role === "user" ? iconSvg("User", 16) : iconSvg("Bot", 16);
            div.innerHTML = `<div class="message-inner">
    <div class="msg-avatar ${avatarClass}">${avatarIcon}
    <div class="msg-body">
      <div class="msg-files" data-files-placeholder>
      <div class="msg-text">${escHtml(msg.content)}${msg._streaming ? '<span class="msg-cursor">' : ""}
    
  `;
            return div;
        }

        async function loadMsgFiles(msgId, msgEl) {

            fp.innerHTML = "";

                    if (url) {
                        const d = document.createElement("div");
                        d.className = "msg-img-thumb";
                        const img = document.createElement("img");
                        img.src = url;
                        img.alt = meta.name;
                        d.appendChild(img);
                        fp.appendChild(d);

                    const d = document.createElement("div");
                    d.className = "msg-file-chip";
                    d.innerHTML = `${iconSvg("FileText", 14)}<div><div class="fc-name">${escHtml(meta.name)}<div class="fc-size">${fmtSize(meta.size)}`;

        function renderGPTFileList() {

                el.innerHTML =

            for (let i = 0; i < gptModalFiles.length; i++) {

                const d = document.createElement("div");
                d.className = "file-list-item";
                d.style.opacity = isPending ? "0.45" : "1";
                d.style.textDecoration = isPending ? "line-through" : "none";
                const statusBadge = f.isExisting ?
                    `<span style="font-size:10px;background:rgba(16,163,127,0.18);color:#10a37f;padding:2px 7px;border-radius:9999px;flex-shrink:0;">&#51200;&#51109;&#46120;` :
                    `<span style="font-size:10px;background:rgba(59,130,246,0.18);color:#60a5fa;padding:2px 7px;border-radius:9999px;flex-shrink:0;">&#49352;&#54028;&#51068;`;
                const delLabel = isPending ? "&#46104;&#46028;&#47532;&#44592;" : "&#49325;&#51228;";
                const delColor = isPending ? "var(--text-muted)" : "var(--danger)";
                const delIcon = isPending ? iconSvg("Plus", 14) : iconSvg("Trash2", 14);
                d.innerHTML = `${iconSvg("FileText", 16)}<div class="file-list-name">${escHtml(f.file_name)}${statusBadge}<span class="file-list-size">${fmtSize(f.file_size)}<button class="file-list-del" data-idx="${i}" title="${delLabel}" style="color:${delColor}">${delIcon}`;
                d.querySelector("[data-idx]").addEventListener("click", () => {
                    const target = gptModalFiles[i];
                    if (target && target.isExisting) {
                        // &#44592;&#51316; DB &#54028;&#51068;: &#49325;&#51228; &#50696;&#51221; &#53664;&#44544;

                        if (pIdx >= 0) {
                            gptModalPendingDeletes.splice(pIdx, 1);

                    } else if (target) {

        async function handleGPTFileUpload(e) {
            const files = Array.from(e.target.files || []);
            if (!files.length) return;
            const btn = document.getElementById("modal-save");
            if (btn) btn.disabled = true;
            for (const file of files) {
                try {
                    const safe = file.name.replace(/[^a-zA-Z0-9._\-&#44032;-&#55203;]/g, "_");
                    const path = `${S.user.id}/gpt-files/${Date.now()}_${safe}`;
                    const {
                        data,
                        error
                    } = await sb.storage.from("chat-files").upload(path, file);
                    if (error) {
                        toast(`${file.name} &#50629;&#47196;&#46300; &#49892;&#54056;: ${error.message}`, "error");
                        continue;
                    }
                    const {
                        data: sd
                    } = await sb.storage.from("chat-files").createSignedUrl(data.path, 60 * 60 * 24 * 365);
                    let fc;
                    try {
                        fc = await file.text();
                        if (fc.length > 50000) fc = fc.slice(0, 50000) + "\n...(&#49373;&#47029;)";
                    } catch {}
                    const TEXT_EXT2 = new Set([
                        "txt",
                        "md",
                        "csv",
                        "json",
                        "log",
                        "xml",
                        "yaml",
                        "yml",
                        "ts",
                        "tsx",
                        "js",
                        "jsx",
                        "py",
                        "css",
                        "html",
                        "sh",
                        "env",
                    ]);
                    const ext = file.name.split(".").pop()?.toLowerCase() || "";
                    if (!file.type.startsWith("text/") && !TEXT_EXT2.has(ext)) fc = undefined;
                    gptModalFiles.push({
                        id: crypto.randomUUID(),
                        custom_gpt_id: "",
                        file_name: file.name,
                        file_url: sd?.signedUrl || "",
                        file_path: data.path,
                        file_size: file.size,
                        mime_type: file.type || "application/octet-stream",
                        file_content: fc,
                        created_at: new Date().toISOString(),
                    });
                    toast(`${file.name} &#50629;&#47196;&#46300; &#50756;&#47308;`, "success");
                } catch (err) {
                    toast(`${file.name}: ${err.message}`, "error");
                }
            }
            if (btn) btn.disabled = false;
            renderGPTFileList();
            if (e.target) e.target.value = "";
        }

        function doSend() {
            const ta = document.getElementById("msg-input");

            S.attachedFiles.forEach((f) => {

                ta.style.height = "auto";

            sendMessage(content, files);

        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
        // &#128295;  UTILS
        // &#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;&#9552;
        function escHtml(s) {

                // &#50504;&#51204;&#51109;&#52824;: &#51068;&#48512; &#50504;&#46300;&#47196;&#51060;&#46300; &#50937;&#48624;&#45716; z-index&#50752; &#47924;&#44288;&#54616;&#44172; iframe&#51060; &#53552;&#52824;&#47484; &#44032;&#47196;&#52292;&#45716; &#48260;&#44536;&#44032; &#51080;&#50612;
