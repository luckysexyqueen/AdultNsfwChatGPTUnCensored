    // IndexedDB Setup
    async function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('GPTFilesDB', 1);
        
        request.onerror = () => reject(request.error);
        request.onsuccess = () => {
          db = request.result;
          resolve(db);
        };
        
        request.onupgradeneeded = (event) => {
          const db = event.target.result;
          if (!db.objectStoreNames.contains('files')) {
            db.createObjectStore('files', { keyPath: 'id' });
          }
        };
      });
    }

    // Store file in IndexedDB
    async function storeFile(file) {
      const id = generateId();
      const fileData = {
        id,
        name: file.name,
        size: file.size,
        type: file.type,
        data: await file.arrayBuffer(),
        created_at: new Date().toISOString()
      };
      
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['files'], 'readwrite');
        const store = transaction.objectStore('files');
        const request = store.add(fileData);
        
        request.onsuccess = () => resolve(fileData);
        request.onerror = () => reject(request.error);
      });
    }

    // Get file from IndexedDB
    async function getFile(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['files'], 'readonly');
        const store = transaction.objectStore('files');
        const request = store.get(id);
        
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    // Delete file from IndexedDB
    async function deleteFile(id) {
      return new Promise((resolve, reject) => {
        const transaction = db.transaction(['files'], 'readwrite');
        const store = transaction.objectStore('files');
        const request = store.delete(id);
        
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
      });
    }

    // Format file size
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
    }

    // Get file icon
    function getFileIcon(fileName) {
      const ext = fileName.split('.').pop().toLowerCase();
      
      // Image
      if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'svg'].includes(ext)) {
        return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>`;
      }
      
      // PDF
      if (ext === 'pdf') {
        return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>`;
      }
      
      // Code
      if (['js', 'ts', 'py', 'java', 'cpp', 'html', 'css', 'json'].includes(ext)) {
        return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="16 18 22 12 16 6"></polyline>
          <polyline points="8 6 2 12 8 18"></polyline>
        </svg>`;
      }
      
      // Default
      return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
        <polyline points="13 2 13 9 20 9"></polyline>
      </svg>`;
    }

    // Render uploaded files

        container.appendChild(item);

    // Responsive Layout Management
    let currentLayout = 'desktop'; // 'desktop', 'tablet', 'mobile'
    
    function detectLayout() {
      const width = window.innerWidth;
      
      if (width >= 1024) {
        return 'desktop';
      } else if (width >= 768) {
        return 'tablet';
      } else {
        return 'mobile';
      }
    }
    
    function updateLayout() {
      const newLayout = detectLayout();
      
      if (newLayout === currentLayout) return;
      
      currentLayout = newLayout;
      
      if (currentLayout === 'desktop') {
        // Desktop: Always show sidebar, hide toggle
        sidebar.classList.remove('open');
        sidebarOverlay.classList.remove('show');
        toggleSidebarBtn.style.display = 'none';
        document.body.style.overflow = '';
      } else {
        // Tablet/Mobile: Show toggle button
        toggleSidebarBtn.style.display = 'block';
      }
      
      console.log('Layout changed to:', currentLayout);

      if (currentLayout === 'desktop') return;

      if (currentLayout === 'desktop') return;
      
      sidebar.classList.remove('open');
      sidebarOverlay.classList.remove('show');

      currentConversationId = id;
      currentGPT = null;
      renderConversations();
      
      const conv = conversations.find(c => c.id === id);
      if (conv) {
        messages = conv.messages || [];
        if (conv.custom_gpt_id) {
          const gpt = customGPTs.find(g => g.id === conv.custom_gpt_id);
          if (gpt) {

            updateChatTitle(gpt.name, conv.title);
          } else {

          }
        } else {
          updateChatTitle('ChatGPT', conv.title);
        }
      }
      
      renderMessages();

      if (isStreaming) messageDiv.id = 'streaming-message';
      
      messageDiv.innerHTML = `
        <div class="message-role">${msg.role === 'user' ? '사용자' : (currentGPT ? currentGPT.name : 'ChatGPT')}</div>
        <div class="message-content">${msg.content}</div>
      `;
      
      chatMessages.appendChild(messageDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    // New Chat
    newChatBtn.addEventListener('click', () => {
      currentConversationId = null;
      currentGPT = null;
      messages = [];
      renderMessages();
      renderConversations();
      updateChatTitle('ChatGPT', '무제한 AI 채팅 - 로그인 불필요');
      if (currentLayout !== 'desktop') {
        closeSidebar();
      }
      chatInput.focus();
    });

    // Delete Conversation
    function deleteConversation(id) {
      conversations = conversations.filter(c => c.id !== id);
      if (currentConversationId === id) {
        currentConversationId = null;
        currentGPT = null;
        messages = [];
        renderMessages();
        updateChatTitle('ChatGPT', '무제한 AI 채팅 - 로그인 불필요');
      }
      saveConversations();
      renderConversations();
    }

    // Chat Input
    chatInput.addEventListener('input', () => {
      chatInput.style.height = 'auto';
      chatInput.style.height = chatInput.scrollHeight + 'px';
      sendBtn.disabled = !chatInput.value.trim() || isStreaming;
    });

    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) {
          sendMessage();
        }
      }
    });

    sendBtn.addEventListener('click', sendMessage);

    // Send Message
    async function sendMessage() {
      const content = chatInput.value.trim();
      if (!content || isStreaming) return;

      chatInput.value = '';
      chatInput.style.height = 'auto';
      sendBtn.disabled = true;

      try {
        let conversationId = currentConversationId;
        let systemPrompt = '';
        let instructions = '';

        if (!conversationId) {
          const title = content.slice(0, 50);
          const newConv = {
            id: generateId(),
            title,
            custom_gpt_id: currentGPT?.id || null,
            system_prompt: currentGPT?.system_prompt || '',
            instructions: currentGPT?.instructions || '',
            messages: [],
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          };
          
          conversationId = newConv.id;
          currentConversationId = conversationId;
          systemPrompt = newConv.system_prompt || '';
          instructions = newConv.instructions || '';
          conversations.unshift(newConv);
          saveConversations();
          renderConversations();
        } else {
          const conv = conversations.find(c => c.id === conversationId);
          systemPrompt = conv?.system_prompt || '';
          instructions = conv?.instructions || '';
        }

        const userMsg = {
          id: generateId(),
          conversation_id: conversationId,
          role: 'user',
          content,
          created_at: new Date().toISOString()
        };

        messages.push(userMsg);
        appendMessage(userMsg);

        // Save to conversation
        const conv = conversations.find(c => c.id === conversationId);
        if (conv) {
          conv.messages = messages;
          conv.updated_at = new Date().toISOString();
          saveConversations();
        }

        isStreaming = true;
        emptyState.classList.add('hidden');

        const chatHistory = messages.map(m => ({
          role: m.role,
          content: m.content
        }));

        const response = await fetch(`${SUPABASE_URL}/functions/v1/chat-stream`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
          },
          body: JSON.stringify({ 
            messages: chatHistory,
            systemPrompt,
            instructions
          }),
        });

        if (!response.ok) {
          throw new Error('스트리밍 요청 실패');
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let fullResponse = '';

        const streamingMsg = {
          id: 'streaming',
          conversation_id: conversationId,
          role: 'assistant',
          content: ''
        };

        appendMessage(streamingMsg, true);

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          const chunk = decoder.decode(value);
          const lines = chunk.split('\n');

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = line.slice(6);
              if (data === '[DONE]') continue;

              try {
                const parsed = JSON.parse(data);
                const content = parsed.choices?.[0]?.delta?.content;
                if (content) {
                  fullResponse += content;
                  const streamingEl = document.getElementById('streaming-message');
                  if (streamingEl) {
                    streamingEl.querySelector('.message-content').textContent = fullResponse;
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                  }
                }
              } catch (e) {
                console.error('Failed to parse SSE:', e);
              }
            }
          }
        }

        document.getElementById('streaming-message')?.remove();

        if (fullResponse) {
          const assistantMsg = {
            id: generateId(),
            conversation_id: conversationId,
            role: 'assistant',
            content: fullResponse,
            created_at: new Date().toISOString()
          };

          messages.push(assistantMsg);
          appendMessage(assistantMsg);

          // Save to conversation
          const conv = conversations.find(c => c.id === conversationId);
          if (conv) {
            conv.messages = messages;
            conv.updated_at = new Date().toISOString();
            
            if (messages.length === 2) {
              const title = content.slice(0, 50);
              conv.title = title;
            }
            
            saveConversations();
            renderConversations();
          }
        }

        isStreaming = false;
        sendBtn.disabled = false;
        chatInput.focus();

      } catch (error) {
        console.error('Send message error:', error);
        showToast('메시지 전송에 실패했습니다', 'error');
        isStreaming = false;
        sendBtn.disabled = false;
        document.getElementById('streaming-message')?.remove();
      }
    }

    // File Upload Handlers
    const fileUploadArea = document.getElementById('file-upload-area');
    const fileInput = document.getElementById('gpt-file-input');

    fileUploadArea.addEventListener('click', () => {
      fileInput.click();
    });

    fileUploadArea.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.stopPropagation();
      fileUploadArea.classList.add('dragover');
    });

    fileUploadArea.addEventListener('dragleave', (e) => {
      e.preventDefault();
      e.stopPropagation();
      fileUploadArea.classList.remove('dragover');
    });

    fileUploadArea.addEventListener('drop', async (e) => {
      e.preventDefault();
      e.stopPropagation();
      fileUploadArea.classList.remove('dragover');
      
      const files = Array.from(e.dataTransfer.files);
      await handleFileUpload(files);
    });

    fileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files);
      await handleFileUpload(files);
      fileInput.value = ''; // Reset input
    });

    async function handleFileUpload(files) {
      if (files.length === 0) return;
      
      showToast(`${files.length}개 파일 업로드 중...`, 'info');
      
      try {
        for (const file of files) {
          const storedFile = await storeFile(file);
          uploadedFiles.push(storedFile);
        }
        
        renderUploadedFiles();
        showToast(`${files.length}개 파일 업로드 완료 ✓`, 'success');
      } catch (error) {
        console.error('File upload error:', error);
        showToast('파일 업로드 실패', 'error');
      }
    }

    // GPT Builder Modal
    async function openGPTBuilder() {
      console.log('Creating new GPT...');
      document.getElementById('gpt-id').value = '';
      document.getElementById('gpt-name').value = '';
      document.getElementById('gpt-description').value = '';
      document.getElementById('gpt-system-prompt').value = '';
      document.getElementById('gpt-instructions').value = '';
      uploadedFiles = [];
      renderUploadedFiles();
      gptBuilderModal.classList.remove('hidden');
      document.getElementById('gpt-name').focus();
    }

    createGptBtn.addEventListener('click', openGPTBuilder);
    document.getElementById('header-create-gpt-btn').addEventListener('click', openGPTBuilder);

    document.getElementById('close-gpt-modal').addEventListener('click', () => {
      gptBuilderModal.classList.add('hidden');
    });

    document.getElementById('cancel-gpt-btn').addEventListener('click', () => {
      gptBuilderModal.classList.add('hidden');
    });

    document.getElementById('gpt-form').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const gptId = document.getElementById('gpt-id').value;
      const gptName = document.getElementById('gpt-name').value.trim();
      
      if (!gptName) {
        showToast('GPT 이름을 입력하세요', 'error');
        return;
      }
      
      const gptData = {
        name: gptName,
        description: document.getElementById('gpt-description').value.trim(),
        system_prompt: document.getElementById('gpt-system-prompt').value.trim(),
        instructions: document.getElementById('gpt-instructions').value.trim(),
        file_ids: uploadedFiles.map(f => f.id)
      };

      console.log('Saving GPT:', gptData);

      if (gptId) {
        const gpt = customGPTs.find(g => g.id === gptId);
        if (gpt) {
          Object.assign(gpt, gptData);
          gpt.updated_at = new Date().toISOString();
          console.log('Updated GPT:', gpt);
        }
      } else {
        const newGPT = {
          id: generateId(),
          ...gptData,
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString()
        };
        customGPTs.unshift(newGPT);
        console.log('Created new GPT:', newGPT);
      }

      saveCustomGPTs();
      renderCustomGPTs();
      gptBuilderModal.classList.add('hidden');
      showToast(gptId ? 'GPT 업데이트 완료 ✓' : 'GPT 생성 완료 ✓', 'success');
      
      // Switch to GPTs tab
      document.querySelector('[data-tab="gpts"]').click();
    });

    async function editGPT(gpt) {
      console.log('Editing GPT:', gpt);
      document.getElementById('gpt-id').value = gpt.id;
      document.getElementById('gpt-name').value = gpt.name;
      document.getElementById('gpt-description').value = gpt.description || '';
      document.getElementById('gpt-system-prompt').value = gpt.system_prompt || '';
      document.getElementById('gpt-instructions').value = gpt.instructions || '';
      
      // Load files
      uploadedFiles = [];
      if (gpt.file_ids && gpt.file_ids.length > 0) {
        for (const fileId of gpt.file_ids) {
          try {
            const file = await getFile(fileId);
            if (file) uploadedFiles.push(file);
          } catch (error) {
            console.error('Failed to load file:', fileId, error);
          }
        }
      }
      renderUploadedFiles();
      
      gptBuilderModal.classList.remove('hidden');
      document.getElementById('gpt-name').focus();
    }

    async function deleteGPT(id) {
      if (!confirm('이 GPT를 삭제하시겠습니까?')) return;

      const gpt = customGPTs.find(g => g.id === id);
      
      // Delete associated files
      if (gpt && gpt.file_ids && gpt.file_ids.length > 0) {
        for (const fileId of gpt.file_ids) {
          try {
            await deleteFile(fileId);
          } catch (error) {
            console.error('Failed to delete file:', fileId, error);
          }
        }
      }

      customGPTs = customGPTs.filter(g => g.id !== id);
      saveCustomGPTs();
      renderCustomGPTs();
      showToast('GPT 삭제 완료', 'success');
    }

    // Settings Modal
    settingsBtn.addEventListener('click', () => {
      if (!currentConversationId) {
        showToast('먼저 대화를 시작하세요', 'error');
        return;
      }

      const conv = conversations.find(c => c.id === currentConversationId);
      if (conv) {
        document.getElementById('conv-system-prompt').value = conv.system_prompt || '';
        document.getElementById('conv-instructions').value = conv.instructions || '';
        settingsModal.classList.remove('hidden');
      }
    });

    document.getElementById('close-settings-modal').addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    document.getElementById('cancel-settings-btn').addEventListener('click', () => {
      settingsModal.classList.add('hidden');
    });

    document.getElementById('settings-form').addEventListener('submit', (e) => {
      e.preventDefault();

      if (!currentConversationId) return;

      const systemPrompt = document.getElementById('conv-system-prompt').value;
      const instructions = document.getElementById('conv-instructions').value;

      const conv = conversations.find(c => c.id === currentConversationId);
      if (conv) {
        conv.system_prompt = systemPrompt;
        conv.instructions = instructions;
        conv.updated_at = new Date().toISOString();
        saveConversations();
      }

      settingsModal.classList.add('hidden');
      showToast('설정 저장 완료', 'success');
    });

    // Sidebar Toggle Handlers
    toggleSidebarBtn.addEventListener('click', toggleSidebar);
    sidebarOverlay.addEventListener('click', closeSidebar);
    
    // Close sidebar when selecting a conversation (mobile/tablet)
    function selectConversationWithClose(id) {
      selectConversation(id);
      if (currentLayout !== 'desktop') {
        closeSidebar();
      }
    }
    
    // Override selectConversation to use close version in render
    const originalSelectConversation = selectConversation;
    
    // Window Resize Handler
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        updateLayout();
      }, 250);
    });
    
    // Orientation Change Handler
    window.addEventListener('orientationchange', () => {
      setTimeout(updateLayout, 300);
    });
    
    // Initialize app
    init().catch(error => {
      console.error('Initialization error:', error);
      showToast('초기화 실패', 'error');
    });
    
    // Log device info
    console.log('Device Info:', {
      userAgent: navigator.userAgent,
      screenWidth: window.screen.width,
      screenHeight: window.screen.height,
      windowWidth: window.innerWidth,
      windowHeight: window.innerHeight,
      devicePixelRatio: window.devicePixelRatio,
      touchSupport: 'ontouchstart' in window,
      layout: currentLayout
    });
  </script>
