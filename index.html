        if (S.currentGPT) {
          b.className = "visible";
          b.innerHTML = `<div class="gpt-banner-avatar">${S.currentGPT.avatar_url ? `<img src="${S.currentGPT.avatar_url}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">` : S.currentGPT.name[0] || "?"}</div><div><div style="font-weight:600;">${escHtml(S.currentGPT.name)}</div>${S.currentGPT.description ? `<div style="font-size:13px;color:rgba(255,255,255,0.6);">${escHtml(S.currentGPT.description)}</div>` : ""}</div>`;
        } else {
          b.className = "";
          b.innerHTML = "";
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🌐  ONLINE / OFFLINE
      // ═══════════════════════════════════════════════════════════════
      window.addEventListener("online", () => {
        setState({ isOnline: true });
        toast("인터넷에 연결되었습니다", "success");
      });
      window.addEventListener("offline", () => {
        setState({ isOnline: false });
        toast("오프라인 상태입니다", "error");
      });

      // ═══════════════════════════════════════════════════════════════
      // 🌐  브라우저 오버레이
      // ═══════════════════════════════════════════════════════════════
      const BROWSER_HOME_URL =
        "https://cdn-ai.onspace.ai/onspace/project/code/latest/9bhrqx-fxFSK9epFvzvsrhp96aAA2-1786020450838174/index.html?_v=1786020457";

      function openBrowserOverlay() {
        const brow = document.getElementById("brow");
        const iframe = document.getElementById("brow-iframe");
        if (!brow || !iframe) return;
        if (!iframe.src || iframe.src === "about:blank") {
          iframe.src = BROWSER_HOME_URL;
        }
        brow.classList.add("open");
        setState({ browserOpen: true });
      }
      function closeBrowserOverlay() {
        const brow = document.getElementById("brow");
        brow?.classList.remove("open");
        // 수동으로 조절한 크기 초기화 → 다음에 열 때 기본 반반 비율로 시작
        if (brow) {
          brow.style.height = "";
          brow.style.width = "";
        }
        setState({ browserOpen: false });
      }
      const browserOrientationQuery = window.matchMedia("(orientation: landscape)");
      function bindBrowserOverlay() {
        document.getElementById("brow-back")?.addEventListener("click", closeBrowserOverlay);
        document.getElementById("brow-reload")?.addEventListener("click", () => {
          const iframe = document.getElementById("brow-iframe");
          if (iframe && iframe.src && iframe.src !== "about:blank") {
            iframe.src = iframe.src;
          }
        });
        document.getElementById("brow-newtab")?.addEventListener("click", () => {
          window.open(BROWSER_HOME_URL, "_blank", "noopener,noreferrer");
        });
        bindBrowserResize();
        // 화면 회전 시 수동 조절값을 지워서 세로=상하 반반 / 가로=좌우 반반 기본값으로 재적용
        browserOrientationQuery.addEventListener("change", () => {
          const brow = document.getElementById("brow");
          if (brow) {
            brow.style.height = "";
            brow.style.width = "";
          }
        });
      }

      // 드래그로 브라우저 패널 / 채팅 화면 분할 비율 조절
      // portrait(세로) = 위아래 드래그로 높이 조절, landscape(가로) = 좌우 드래그로 너비 조절
      function bindBrowserResize() {
        const handle = document.getElementById("brow-resize");
        const brow = document.getElementById("brow");
        if (!handle || !brow) return;
        let dragging = false;
        const apply = (clientX, clientY) => {
          if (browserOrientationQuery.matches) {
            const vw = window.innerWidth;
            const min = vw * 0.2;
            const max = vw * 0.8;
            const w = Math.max(min, Math.min(max, clientX));
            brow.style.width = w + "px";
          } else {
            const vh = window.innerHeight;
            const min = vh * 0.18;
            const max = vh * 0.8;
            const h = Math.max(min, Math.min(max, clientY));
            brow.style.height = h + "px";
          }
        };
        handle.addEventListener("pointerdown", (e) => {
          if (!brow.classList.contains("open")) return;
          dragging = true;
          brow.classList.add("resizing");
          handle.setPointerCapture(e.pointerId);
        });
        handle.addEventListener("pointermove", (e) => {
          if (!dragging) return;
          apply(e.clientX, e.clientY);
        });
        const endDrag = () => {
          if (!dragging) return;
          dragging = false;
          brow.classList.remove("resizing");
        };
        handle.addEventListener("pointerup", endDrag);
        handle.addEventListener("pointercancel", endDrag);
      }

      // ═══════════════════════════════════════════════════════════════
      // 🚀  GGUF 모델 임포트 로직 (커스텀 GPT 빌더 내 통합)
      // ═══════════════════════════════════════════════════════════════
      let ggufWllama = null;

      function initGGUFControls() {
        const sourceRadios = document.querySelectorAll('input[name="gguf-source"]');
        const urlInput = document.getElementById("gguf-url");
        const fileBtn = document.getElementById("gguf-file-btn");
        const fileInput = document.getElementById("gguf-file");
        const loadBtn = document.getElementById("gguf-load-btn");
        const statusDiv = document.getElementById("gguf-status");
        const outputDiv = document.getElementById("gguf-output");

        if (!sourceRadios.length) return;

        sourceRadios.forEach((radio) => {
          radio.addEventListener("change", (e) => {
            if (e.target.value === "url") {
              urlInput.style.display = "block";
              fileBtn.style.display = "none";
            } else {
              urlInput.style.display = "none";
              fileBtn.style.display = "block";
            }
          });
        });

        fileBtn?.addEventListener("click", () => {
          fileInput?.click();
        });

        fileInput?.addEventListener("change", (e) => {
          const file = e.target.files?.[0];
          if (file) {
            fileBtn.textContent = `✓ ${file.name}`;
            fileBtn.style.color = "var(--accent)";
          }
        });

        loadBtn?.addEventListener("click", async () => {
          loadBtn.disabled = true;
          statusDiv.style.display = "block";
          outputDiv.style.display = "block";
          statusDiv.textContent = "상태: 시스템 연동 및 하드웨어 가속 레이어 빌드 중...";
          outputDiv.textContent = "";

          try {
            // Wllama 동적 로드
            if (!window.Wllama) {
              const module = await import("https://cdn.jsdelivr.net/npm/@wllama/wllama@1.14.0/+esm");
              window.Wllama = module.Wllama;
            }

            const engineConfig = {
              "n-gpu-layers": 33,
            };

            ggufWllama = new window.Wllama(engineConfig);

            const progressCallback = ({ loaded, total }) => {
              if (total > 0) {
                const percent = Math.round((loaded / total) * 100);
                statusDiv.textContent = `상태: 모델 가중치 데이터 메모리 주입 중 (${percent}%)`;
              }
            };

            const sourceType = document.querySelector('input[name="gguf-source"]:checked')?.value;

            if (sourceType === "url") {
              const url = urlInput.value.trim();
              if (!url) {
                statusDiv.textContent = "상태: 🔴 URL을 입력해주세요";
                statusDiv.style.color = "#ef4444";
                loadBtn.disabled = false;
                return;
              }
              await ggufWllama.loadModelFromUrl(url, { progress_callback: progressCallback });
            } else {
              const file = fileInput?.files?.[0];
              if (!file) {
                statusDiv.textContent = "상태: 🔴 GGUF 파일을 선택해주세요";
                statusDiv.style.color = "#ef4444";
                loadBtn.disabled = false;
                return;
              }
              await ggufWllama.loadModelFromFile(file, { progress_callback: progressCallback });
            }

            statusDiv.textContent = "상태: 🟢 엔진 로드 완료! 모델 테스트 중...";
            statusDiv.style.color = "#10a37f";

            // 간단한 테스트 추론
            const testPrompt = "<|im_start|>user\n안녕하세요<|im_end|>\n<|im_start|>assistant\n";
            let testOutput = "";

            await ggufWllama.createCompletion(testPrompt, {
              n_predict: 50,
              sampling: { temp: 0.7, top_k: 40, top_p: 0.9 },
              onNewToken: (token, piece, currentText) => {
                testOutput = currentText;
                outputDiv.textContent = testOutput;
              },
            });

            statusDiv.textContent = "상태: 🟢 모델 로드 및 테스트 완료! 이제 GPT를 저장할 수 있습니다.";
            statusDiv.style.color = "#10a37f";
            outputDiv.textContent = testOutput || "테스트 완료";
          } catch (err) {
            statusDiv.textContent = `상태: 🔴 오류 - ${err.message}`;
            statusDiv.style.color = "#ef4444";
            outputDiv.textContent = `에러: ${err.message}`;
          } finally {
            loadBtn.disabled = false;
          }
        });
      }

      // renderGPTModal 함수 내에서 GGUF 컨트롤 초기화
      const originalRenderGPTModal = renderGPTModal;
      async function renderGPTModal() {
        await originalRenderGPTModal();
        setTimeout(() => initGGUFControls(), 100);
      }

      // ═══════════════════════════════════════════════════════════════
      // 🚀  BOOT
      // ═══════════════════════════════════════════════════════════════
      (async () => {
        await supabaseReady; // anon key 해석 + Supabase 클라이언트 준비를 기다린다 (필요 시 입력폼 대기)
        bindBrowserOverlay();
        try {
          try {
            await Promise.all([
              blobStore.ready(),
              metaStore.ready(),
              msgFileStore.ready(),
              convStore.ready(),
              msgStore.ready(),
            ]);
          } catch (e) {
            console.warn("LocalForage init:", e);
          }

          await withTimeout(initAuth(), 6000, undefined);
          if (S.user) {
            await withTimeout(loadUserData(), 8000, undefined);
          }
        } catch (e) {
          console.warn("Boot error:", e);
        } finally {
          if (S.loading) setState({ loading: false, view: S.user ? "chat" : "auth" });
          render();
          document.getElementById("loading-screen").classList.add("hidden");
        }
      })();

      // PWA Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>

    <!-- GPT builder fallback + binding script (inserted by Copilot) -->
<script>
  (function () {
    if (!window.renderGPTModal) {
      window.renderGPTModal = async function () {
        try {
          const S = (window.S = window.S || {});
          const setState =
            window.setState ||
            function (s) {
              Object.assign(window.S, s);
            };
          const render = window.render || function () {};
          const toast = window.toast || function () {};

          if (typeof render === "function") {
            setState({ gptBuilderOpen: true, gptBuilderEditing: null });
            try {
              render();
            } catch (e) {}
            await new Promise((r) => setTimeout(r, 120));
            if (document.getElementById("gpt-modal")) return;
          }

          let modal = document.getElementById("gpt-modal-fallback");
          if (!modal) {
            modal = document.createElement("div");
            modal.id = "gpt-modal-fallback";
            Object.assign(modal.style, {
              position: "fixed",
              inset: "0",
              zIndex: 2147483647,
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              background: "rgba(0,0,0,0.35)",
            });

            const box = document.createElement("div");
            box.style.cssText =
              "width:92%;max-width:720px;background:var(--bg2,#2f2f2f);color:var(--text,#fff);border:1px solid rgba(255,255,255,0.08);border-radius:12px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,0.6);";
            box.innerHTML = `
            <h3 style="margin:0 0 8px 0;font-size:18px">커스텀 GPT 빌더 (임시)</h3>
            <input id="fb-gpt-name" placeholder="이름" style="width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin-bottom:8px;background:transparent;color:inherit" />
            <textarea id="fb-gpt-desc" placeholder="설명" style="width:100%;height:120px;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit"></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px">
              <button id="fb-gpt-cancel" style="padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:inherit;cursor:pointer">취소</button>
              <button id="fb-gpt-save" style="padding:8px 12px;border-radius:8px;border:none;background:var(--accent,#10a37f);color:#fff;cursor:pointer">저장</button>
            </div>
            <div id="fb-gpt-note" style="margin-top:8px;color:rgba(255,255,255,0.6);font-size:12px"></div>
          `;
            modal.appendChild(box);
            document.body.appendChild(modal);

            document.getElementById("fb-gpt-cancel").addEventListener("click", () => modal.remove());

            document.getElementById("fb-gpt-save").addEventListener("click", async () => {
              const name = (document.getElementById("fb-gpt-name").value || "").trim();
              const desc = (document.getElementById("fb-gpt-desc").value || "").trim();
              if (!name) {
                if (window.toast) window.toast("이름을 입력하세요", "error");
                else alert("이름을 입력하세요");
                return;
              }

              try {
                const g = {
                  id: `local_gpt_${Date.now()}`,
                  name,
                  description: desc,
                  created_at: new Date().toISOString(),
                };
                if (window.localforage) {
                  const cur = (await localforage.getItem("custom_gpts_v1")) || [];
                  cur.unshift(g);
                  await localforage.setItem("custom_gpts_v1", cur);
                } else {
                  const cur = JSON.parse(localStorage.getItem("custom_gpts_v1") || "[]");
                  cur.unshift(g);
                  localStorage.setItem("custom_gpts_v1", JSON.stringify(cur));
                }

                window.S = window.S || {};
                window.S.customGPTs = window.S.customGPTs || [];
                window.S.customGPTs.unshift(g);
                if (window.updateGPTSection)
                  try {
                    window.updateGPTSection();
                  } catch (e) {}
                if (window.render)
                  try {
                    window.render();
                  } catch (e) {}

                if (window.toast) window.toast("저장되었습니다", "success");
                else alert("저장되었습니다");
                modal.remove();
              } catch (err) {
                console.error("save fallback gpt error", err);
                alert("저장 중 오류가 발생했습니다");
              }
            });

            const escHandler = (ev) => {
              if (ev.key === "Escape") {
                modal.remove();
                window.removeEventListener("keydown", escHandler);
              }
            };
            window.addEventListener("keydown", escHandler);
          } else {
            modal.style.display = "flex";
          }
        } catch (err) {
          console.error("renderGPTModal fallback error", err);
        }
      };
    }

    function bindButtonsOnce() {
      const nodes = Array.from(document.querySelectorAll(".btn-create-gpt, #btn-create-gpt"));
      nodes.forEach((btn) => {
        if (btn.dataset._gptBound) return;
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          try {
            if (window.renderGPTModal) window.renderGPTModal();
            else {
              window.S = window.S || {};
              window.S.gptBuilderOpen = true;
              if (window.render) window.render();
            }
          } catch (err) {
            console.error(err);
          }
        });
        btn.dataset._gptBound = "1";
      });

      if (!document.body.dataset._gptDelegate) {
        document.body.addEventListener("click", function (e) {
          const b = e.target.closest && e.target.closest(".btn-create-gpt, #btn-create-gpt");
          if (b) {
            e.preventDefault();
            try {
              if (window.renderGPTModal) window.renderGPTModal();
              else {
                window.S = window.S || {};
                window.S.gptBuilderOpen = true;
                if (window.render) window.render();
              }
            } catch (err) {
              console.error(err);
            }
          }
        });
        document.body.dataset._gptDelegate = "1";
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      bindButtonsOnce();
      const iv = setInterval(bindButtonsOnce, 1000);
      setTimeout(() => clearInterval(iv), 30000);
    });

    if (document.readyState === "interactive" || document.readyState === "complete") bindButtonsOnce();
  })();
</script>
