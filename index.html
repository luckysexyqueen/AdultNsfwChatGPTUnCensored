<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10a37f" />
    <meta name="description" content="제한 없는 AI 채팅 애플리케이션" />
    <title>AI Chat - 무제한 대화</title>
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon.png" />
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <!-- 🔑 SUPABASE_ANON_KEY 자동 설정: generate-env-config.js가 .env로부터 빌드 시 생성하는 파일.
         파일이 없으면 404가 나도 무시되고 localStorage → 입력폼 순서로 자동 진행됩니다. -->
    <script
      src="/env-config.js"
      onerror="console.info('[env-config] 파일 없음 — localStorage/입력폼으로 진행')"
    ></script>
    <!-- LocalForage -->
    <script src="https://cdn.jsdelivr.net/npm/localforage@1.10.0/dist/localforage.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <!-- Font Awesome (브라우저 오버레이 아이콘용) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
      /* ===== RESET & BASE ===== */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        background: #212121;
        color: #fff;
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      #app {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        position: relative;
        overflow: hidden;
      }

      /* ===== VARIABLES ===== */
      :root {
        --bg: #212121;
        --bg2: #2f2f2f;
        --bg3: #343541;
        --bg4: #40414f;
        --border: rgba(255, 255, 255, 0.1);
        --accent: #10a37f;
        --accent-hover: #0d8968;
        --text: #fff;
        --text-muted: rgba(255, 255, 255, 0.5);
        --text-dim: rgba(255, 255, 255, 0.25);
        --danger: #ef4444;
      }

      /* ── 브라우저 패널 (채팅 화면과 항상 함께 보이는 분할 패널) ──
         portrait(세로): 위/아래 반반, landscape(가로): 좌/우 반반 */
      #brow {
        flex-shrink: 0;
        display: flex;
        flex-direction: column; /* portrait 기본값: 내용 위, 핸들 아래 */
        width: 100%;
        height: 0;
        min-width: 0;
        min-height: 0;
        background: #0a0b0f;
        overflow: hidden;
        transition: height 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #brow.open {
        height: 50vh;
        border-bottom: 1px solid #1e1f2e;
      }
      #brow.resizing {
        transition: none;
      }
      #brow-content {
        flex: 1;
        min-width: 0;
        min-height: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #brow-resize {
        flex-shrink: 0;
        height: 14px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: row-resize;
        background: #0e0f14;
        touch-action: none;
      }
      #brow-resize::after {
        content: "";
        width: 40px;
        height: 4px;
        border-radius: 2px;
        background: #3a3c4a;
      }
      /* landscape(가로 모드): 채팅과 브라우저를 좌우로 반반 배치 */
      @media (orientation: landscape) {
        body {
          flex-direction: row;
        }
        #app {
          min-width: 0;
        }
        #brow {
          flex-direction: row; /* 내용 왼쪽, 핸들 오른쪽 */
          width: 0;
          height: 100%;
          transition: width 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #brow.open {
          width: 50vw;
          height: 100%;
          border-bottom: none;
          border-right: 1px solid #1e1f2e;
        }
        #brow-resize {
          width: 14px;
          height: 100%;
          cursor: col-resize;
        }
        #brow-resize::after {
          width: 4px;
          height: 40px;
        }
      }
      #brow-tb {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: #0e0f14;
        border-bottom: 1px solid #1e1f2e;
      }
      #brow-url {
        flex: 1;
        background: #16171f;
        border: 1px solid #2d2f3e;
        border-radius: 7px;
        padding: 5px 10px;
        font-size: 11px;
        color: #9ca3af;
        font-family: "JetBrains Mono", monospace;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #brow-iframe {
        flex: 1;
        width: 100%;
        border: none;
      }

      /* ===== SCROLLBAR ===== */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.25);
      }

      /* ===== LAYOUT ===== */
      #main-layout {
        display: flex;
        height: 100%;
        overflow: hidden;
      }

      /* ===== SIDEBAR ===== */
      #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 260px;
        min-width: 260px;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 300;
        transform: translateX(-100%);
        transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
        box-shadow: 2px 0 24px rgba(0, 0, 0, 0.4);
      }
      #sidebar.open {
        transform: translateX(0);
      }
      #sidebar-backdrop {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 290;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #sidebar-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }
      .sidebar-toggle-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg3);
        border: 1px solid var(--border);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .sidebar-toggle-btn:hover {
        background: var(--bg4);
      }
      .sidebar-toggle-btn.active {
        background: var(--accent);
        border-color: var(--accent);
      }
      .sidebar-top {
        padding: 12px;
        border-bottom: 1px solid var(--border);
      }
      .btn-new-chat {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        cursor: pointer;
        font-size: 14px;
        transition: background 0.15s;
      }
      .btn-new-chat:hover {
        background: var(--bg3);
      }
      .sidebar-section {
        flex: 1;
        overflow-y: auto;
        padding: 8px;
      }
      .sidebar-label {
        font-size: 11px;
        color: var(--text-muted);
        padding: 8px 10px 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .conv-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
      }
      .conv-item:hover {
        background: var(--bg3);
      }
      .conv-item.active {
        background: var(--bg4);
      }
      .conv-item-title {
        flex: 1;
        font-size: 13px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .conv-item-del {
        opacity: 0;
        background: none;
        border: none;
        color: var(--danger);
        cursor: pointer;
        padding: 2px;
        border-radius: 4px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .conv-item:hover .conv-item-del {
        opacity: 1;
      }

      /* GPT List */
      .gpt-section {
        border-bottom: 1px solid var(--border);
        padding: 8px;
      }
      .gpt-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 10px;
      }
      .gpt-header-title {
        font-size: 14px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-create-gpt {
        font-size: 12px;
        padding: 4px 10px;
        background: var(--accent);
        border: none;
        border-radius: 6px;
        color: white;
        cursor: pointer;
      }
      .btn-create-gpt:hover {
        background: var(--accent-hover);
      }
      .gpt-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s;
        position: relative;
      }
      .gpt-item:hover {
        background: var(--bg3);
      }
      .gpt-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-weight: bold;
        font-size: 14px;
      }
      .gpt-avatar img {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        object-fit: cover;
      }
      .gpt-info {
        flex: 1;
        min-width: 0;
      }
      .gpt-name {
        font-size: 13px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gpt-desc {
        font-size: 11px;
        color: var(--text-muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .gpt-actions {
        display: none;
        gap: 2px;
      }
      .gpt-item:hover .gpt-actions {
        display: flex;
      }
      .gpt-action-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        padding: 4px;
        border-radius: 4px;
        display: flex;
        align-items: center;
      }
      .gpt-action-btn:hover {
        background: var(--bg4);
        color: var(--text);
      }
      .gpt-empty {
        text-align: center;
        color: var(--text-muted);
        font-size: 12px;
        padding: 16px 8px;
      }

      /* ===== HEADER ===== */
      #header {
        height: 56px;
        min-height: 56px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        background: var(--bg2);
      }
      .header-title {
        font-size: 18px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .guest-badge {
        font-size: 11px;
        background: rgba(234, 179, 8, 0.2);
        color: #eab308;
        padding: 2px 8px;
        border-radius: 9999px;
      }
      .header-right {
        position: relative;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .browser-toggle-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--bg3);
        border: 1px solid var(--border);
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .browser-toggle-btn:hover {
        background: var(--bg4);
      }
      .browser-toggle-btn.active {
        background: var(--accent);
        border-color: var(--accent);
      }
      .user-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        color: white;
        cursor: pointer;
        font-weight: 600;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dropdown {
        position: absolute;
        top: calc(100% + 8px);
        right: 0;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 10px;
        min-width: 200px;
        overflow: hidden;
        z-index: 100;
        display: none;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      .dropdown.open {
        display: block;
      }
      .dropdown-header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
      }
      .dropdown-user-name {
        font-size: 13px;
        font-weight: 500;
      }
      .dropdown-user-email {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .dropdown-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s;
      }
      .dropdown-item:hover {
        background: var(--bg4);
      }
      .dropdown-item.danger {
        color: var(--danger);
      }
      .dropdown-sep {
        height: 1px;
        background: var(--border);
        margin: 4px 0;
      }

      /* ===== GPT BANNER ===== */
      #gpt-banner {
        background: linear-gradient(to right, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
        border-bottom: 1px solid var(--border);
        padding: 10px 24px;
        display: none;
        align-items: center;
        gap: 12px;
      }
      #gpt-banner.visible {
        display: flex;
      }
      .gpt-banner-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: linear-gradient(135deg, #8b5cf6, #ec4899);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 13px;
        flex-shrink: 0;
      }

      /* ===== CHAT AREA ===== */
      #content-area {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      #messages-area {
        flex: 1;
        overflow-y: auto;
      }
      .messages-inner {
        padding-bottom: 16px;
      }

      /* Empty state */
      #empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        padding: 40px 20px;
        text-align: center;
      }
      .empty-logo {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .empty-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .empty-sub {
        color: var(--text-muted);
        font-size: 14px;
      }

      /* Message */
      .message {
        padding: 20px 16px;
      }
      .message.assistant {
        background: rgba(255, 255, 255, 0.03);
      }
      .message-inner {
        max-width: 720px;
        margin: 0 auto;
        display: flex;
        gap: 14px;
      }
      .msg-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
      }
      .msg-avatar.user {
        background: var(--accent);
      }
      .msg-avatar.assistant {
        background: var(--bg4);
      }
      .msg-body {
        flex: 1;
        min-width: 0;
        padding-top: 4px;
      }
      .msg-text {
        font-size: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
      }
      .msg-cursor {
        display: inline-block;
        width: 8px;
        height: 16px;
        background: var(--text);
        border-radius: 2px;
        margin-left: 3px;
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      /* File attachments in messages */
      .msg-files {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 8px;
      }
      .msg-img-thumb {
        max-width: 280px;
        max-height: 200px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .msg-img-thumb img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
      }
      .msg-file-chip {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        font-size: 12px;
        max-width: 220px;
      }
      .msg-file-chip .fc-name {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .msg-file-chip .fc-size {
        color: var(--text-muted);
        font-size: 10px;
        margin-top: 1px;
      }

      /* ===== CHAT INPUT ===== */
      #chat-input-area {
        border-top: 1px solid var(--border);
        background: var(--bg);
        padding: 12px 16px 14px;
      }
      .input-wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      #file-previews {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 10px;
      }
      .fp-img {
        position: relative;
        width: 76px;
        height: 76px;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid var(--border);
      }
      .fp-img img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .fp-img-name {
        position: absolute;
        bottom: 0;
        inset-x: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
        font-size: 9px;
        padding: 4px 3px 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fp-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        background: var(--bg3);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 10px;
        max-width: 190px;
      }
      .fp-chip-name {
        font-size: 11px;
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .fp-chip-size {
        font-size: 9px;
        color: var(--text-muted);
      }
      .fp-remove {
        background: rgba(0, 0, 0, 0.6);
        border: none;
        color: #fff;
        cursor: pointer;
        border-radius: 50%;
        width: 18px;
        height: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: absolute;
        top: 3px;
        right: 3px;
        font-size: 10px;
      }
      .fp-chip .fp-remove {
        position: static;
        background: none;
        color: var(--text-muted);
        font-size: 12px;
      }
      .input-box {
        display: flex;
        align-items: flex-end;
        gap: 8px;
        background: var(--bg2);
        border-radius: 14px;
        border: 1px solid var(--border);
        padding: 10px 14px;
      }
      .input-box-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2px;
        border-radius: 6px;
        transition: color 0.15s;
        flex-shrink: 0;
        margin-bottom: 2px;
      }
      .input-box-btn:hover {
        color: var(--text);
      }
      .input-box-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
      }
      #msg-input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
        resize: none;
        min-height: 24px;
        max-height: 180px;
        overflow-y: auto;
        font-family: inherit;
      }
      #msg-input::placeholder {
        color: var(--text-dim);
      }
      .send-btn {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: var(--accent);
        border: none;
        color: white;
        cursor: pointer;
        flex-shrink: 0;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s;
      }
      .send-btn:hover {
        background: var(--accent-hover);
      }
      .send-btn:disabled {
        opacity: 0.25;
        cursor: not-allowed;
      }
      .input-hint {
        font-size: 11px;
        color: var(--text-dim);

      /* ===== AUTH PAGE ===== */

      /* ===== GPT BUILDER MODAL ===== */
      .modal-overlay {

      /* ===== TOAST ===== */

  <body>
    <div id="loading-screen"><div class="spinner"></div></div>
    <div id="toast-container"></div>

    <!-- ── 브라우저 패널 (항상 채팅 화면과 함께 표시) ── -->
    <div id="brow">
      <div id="brow-content">
        <div id="brow-tb">
          <button id="brow-back" class="input-box-btn" style="border-radius: 7px; min-height: 34px; color: #fff">
            <i class="fa-solid fa-xmark"></i>
            &nbsp;닫기
          </button>
          <div id="brow-url">
            <i class="fa-solid fa-lock" style="color: #4ade80; margin-right: 4px"></i>
            GoldFireDragonBrowser
          </div>
          <button
            id="brow-reload"
            class="input-box-btn"
            style="width: 32px; height: 32px; color: #fff"
            title="새로고침"
          >
            <i class="fa-solid fa-rotate-right"></i>
          </button>
          <button
            id="brow-newtab"
            class="input-box-btn"
            style="width: 32px; height: 32px; color: #fff"
            title="새 탭에서 열기"
          >
            <i class="fa-solid fa-arrow-up-right-from-square"></i>
          </button>
        </div>
        <iframe
          id="brow-iframe"
          src="about:blank"
          title="브라우저"
          allowfullscreen=""
          style="flex: 1; width: 100%; border: none"
        ></iframe>
      </div>
      <div id="brow-resize" title="드래그하여 크기 조절"></div>
    </div>

    <div id="app"></div>

    <script>
      // ═══════════════════════════════════════════════════════════════
      // 🛡️  최우선 안전망 — CDN 로딩 실패 등 어떤 예외가 나도
      //     로딩 화면이 무한정 떠 있지 않도록 강제로 처리한다.
      // ═══════════════════════════════════════════════════════════════
      window.__bootFailed = false;
      window.addEventListener("error", function (e) {
        if (window.__bootFailed) return;
        window.__bootFailed = true;
        console.error("Boot-level error:", e.error || e.message);
        var ls = document.getElementById("loading-screen");
        if (ls) {
          ls.innerHTML =
            '<div style="text-align:center;padding:24px;color:#fff;font-family:-apple-system,sans-serif;">' +
            '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">앱을 불러오는 중 문제가 발생했습니다</div>' +
            '<div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:16px;">네트워크 연결을 확인하고 새로고침해주세요.</div>' +
            '<button onclick="location.reload()" style="padding:10px 20px;background:#10a37f;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;">새로고침</button>' +
            "</div>";
        }
      });
      // 8초 안에 부팅이 끝나지 않으면(로딩 화면이 안 사라지면) 강제로 에러 처리
      window.__bootWatchdog = setTimeout(function () {
        var ls = document.getElementById("loading-screen");
        var waitingForKeyInput = document.getElementById("sb-key-overlay");
        if (ls && !ls.classList.contains("hidden") && !window.__bootFailed && !waitingForKeyInput) {
          window.__bootFailed = true;
          ls.innerHTML =
            '<div style="text-align:center;padding:24px;color:#fff;font-family:-apple-system,sans-serif;">' +
            '<div style="font-size:16px;font-weight:600;margin-bottom:8px;">로딩이 너무 오래 걸립니다</div>' +
            '<div style="font-size:13px;color:rgba(255,255,255,0.6);margin-bottom:16px;">네트워크 연결을 확인하고 새로고침해주세요.</div>' +
            '<button onclick="location.reload()" style="padding:10px 20px;background:#10a37f;border:none;border-radius:8px;color:#fff;font-size:14px;cursor:pointer;">새로고침</button>' +
            "</div>";
        }
      }, 12000);

      // ═══════════════════════════════════════════════════════════════
      // ⚙️  설정 — Supabase URL
      // ═══════════════════════════════════════════════════════════════
      const SUPABASE_URL = "https://shtixmaykwundutbshti.backend.onspace.ai";
      const EDGE_FUNCTION_URL = `${SUPABASE_URL}/functions/v1/chat-stream`;

      // ═══════════════════════════════════════════════════════════════
      // 🔑  SUPABASE_ANON_KEY 자동 설정 (하드코딩 불필요)
      //     우선순위: ① /env-config.js  (.env의 VITE_SUPABASE_ANON_KEY → generate-env-config.js가 빌드 시 생성)
      //              ② localStorage    (이 기기에 이전에 저장된 값)
      //              ③ 최초 실행 입력폼 (제출 시 localStorage에 저장 → 다음부터는 자동으로 재사용)
      // ═══════════════════════════════════════════════════════════════
      const SB_KEY_STORAGE_NAME = "SUPABASE_ANON_KEY";

      function getEnvAnonKey() {
        try {
          return (window.__ENV__ && window.__ENV__.SUPABASE_ANON_KEY) || "";
        } catch (e) {
          return "";
        }
      }

      function getSavedAnonKey() {
        try {
          return localStorage.getItem(SB_KEY_STORAGE_NAME) || "";
        } catch (e) {
          return "";
        }
      }

      function saveAnonKey(key) {
        try {
          localStorage.setItem(SB_KEY_STORAGE_NAME, key);
        } catch (e) {
          console.warn("localStorage 저장 실패:", e);
        }
      }

      function askAnonKeyViaModal() {
        return new Promise((resolve) => {
          const overlay = document.createElement("div");
          overlay.id = "sb-key-overlay";
          overlay.className = "modal-overlay";
          overlay.innerHTML = `
            <div class="modal-box" style="max-width:420px;">
              <div class="modal-header">
                <div class="modal-title">Supabase 연결 설정</div>
              </div>
              <div class="modal-body">
                <div class="form-group">
                  <label class="form-label">Supabase Anon Key<span class="req">*</span></label>
                  <div class="form-hint">최초 1회만 입력하면 이 기기에 저장되어 다음부터 자동으로 사용됩니다.</div>
                  <input class="form-input" id="sb-key-input" type="text" placeholder="eyJhbGciOi..." autocomplete="off" spellcheck="false" />
                  <div class="sb-key-error" id="sb-key-error"></div>
                </div>
                <button class="auth-btn primary" id="sb-key-submit">저장하고 시작하기</button>
              </div>
            </div>`;
          document.body.appendChild(overlay);

          const input = overlay.querySelector("#sb-key-input");
          const errEl = overlay.querySelector("#sb-key-error");

          function submit() {
            const val = input.value.trim();
            if (!val) {
              errEl.textContent = "Anon Key를 입력해주세요.";
              input.focus();
              return;
            }
            saveAnonKey(val);
            overlay.remove();
            resolve(val);
          }

          overlay.querySelector("#sb-key-submit").addEventListener("click", submit);
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") submit();
          });
          setTimeout(() => input.focus(), 50);
        });
      }

      async function resolveAnonKey() {
        const fromEnv = getEnvAnonKey();
        if (fromEnv) return fromEnv;
        const fromStorage = getSavedAnonKey();
        if (fromStorage) return fromStorage;
        return await askAnonKeyViaModal();
      }

      // ═══════════════════════════════════════════════════════════════
      // 🗄️  SUPABASE CLIENT (CDN 로딩 실패 + 키 미설정에 대비한 방어적 초기화)
      //     anon key 해석이 끝날 때까지 기다린 뒤 클라이언트를 생성한다.
      //     BOOT 시퀀스는 아래 supabaseReady를 await한 뒤 진행된다.
      // ═══════════════════════════════════════════════════════════════
      let sb = null;
      const supabaseReady = (async () => {
        try {
          const anonKey = await resolveAnonKey();
          if (typeof supabase === "undefined" || !supabase.createClient) {
            throw new Error("Supabase SDK가 로드되지 않았습니다 (CDN 차단/네트워크 문제 가능성)");
          }
          sb = supabase.createClient(SUPABASE_URL, anonKey, {
            auth: { persistSession: true, autoRefreshToken: true },
          });
        } catch (e) {
          console.error("Supabase client init failed:", e);
          // sb가 null이면 아래 모든 sb.* 호출이 실패하므로,
          // 최소한의 no-op 더미 클라이언트로 대체해 스크립트 전체가 죽지 않게 한다.
          const alwaysFail = () => Promise.resolve({ data: null, error: new Error("Supabase unavailable") });
          const chain = () => {
            const obj = {
              select: () => chain(),
              eq: () => chain(),
              or: () => chain(),
              order: () => chain(),
              insert: () => chain(),
              update: () => chain(),
              delete: () => chain(),
              single: () => alwaysFail(),
              then: (resolve) => resolve({ data: [], error: new Error("Supabase unavailable") }),
            };
            return obj;
          };
          sb = {
            auth: {
              getSession: () => Promise.resolve({ data: { session: null } }),
              onAuthStateChange: () => ({ data: { subscription: { unsubscribe() {} } } }),
              signInWithPassword: () => alwaysFail(),
              signInWithOtp: () => alwaysFail(),
              verifyOtp: () => alwaysFail(),
              updateUser: () => alwaysFail(),
              signOut: () => Promise.resolve({ error: null }),
            },
            from: () => chain(),
            storage: {
              from: () => ({
                upload: () => alwaysFail(),
                createSignedUrl: () => alwaysFail(),
              }),
            },
          };
        }

        // (기존에 최상위에서 바로 등록되던 인증 상태 리스너 — sb가 준비된 직후로 이동)
        sb.auth.onAuthStateChange((event, session) => {
          if (event === "SIGNED_IN" && session?.user) {
            setState({ user: mapUser(session.user), view: "chat" });
            loadUserData();
          } else if (event === "SIGNED_OUT") {
            setState({
              user: null,
              view: "auth",
              conversations: [],
              messages: [],
              customGPTs: [],
              currentConvId: null,
              currentGPT: null,
            });
          } else if (event === "TOKEN_REFRESHED" && session?.user) {
            setState({ user: mapUser(session.user) });
          }
        });
      })();

      // ═══════════════════════════════════════════════════════════════
      // 📦  LOCALFORAGE STORES (파일 영구 저장) — CDN 실패 대비 폴백 포함
      // ═══════════════════════════════════════════════════════════════
      function makeStore(opts) {
        if (typeof localforage !== "undefined" && localforage.createInstance) {
          return localforage.createInstance(opts);
        }
        // localforage 로드 실패 시: 메모리 기반 더미 스토어로 대체 (새로고침 시 사라짐)
        const mem = new Map();
        return {
          async getItem(k) {
            return mem.has(k) ? mem.get(k) : null;
          },
          async setItem(k, v) {
            mem.set(k, v);
            return v;
          },
          async removeItem(k) {
            mem.delete(k);
          },
          async iterate(cb) {
            let i = 0;
            for (const [k, v] of mem.entries()) {
              cb(v, k, ++i);
            }
          },
          async ready() {
            return true;
          },
        };
      }
      const blobStore = makeStore({ name: "aichat-files", storeName: "blobs" });
      const metaStore = makeStore({ name: "aichat-files", storeName: "meta" });
      const msgFileStore = makeStore({ name: "aichat-files", storeName: "msg_files" });
      const convStore = makeStore({ name: "aichat-offline", storeName: "conversations" });
      const msgStore = makeStore({ name: "aichat-offline", storeName: "messages" });

      const TEXT_EXTS = new Set([
        "txt",
        "md",
        "csv",
        "json",
        "log",
        "xml",
        "yaml",
        "yml",
        "ts",
        "tsx",
        "js",
        "jsx",
        "py",
        "css",
        "html",
        "sh",
        "env",
        "ini",
        "toml",
        "sql",
        "rs",
        "go",
        "java",
        "kt",
        "swift",
        "c",
        "cpp",
        "h",
        "cs",
        "php",
        "rb",
      ]);
      function fileType(file) {
        if (file.type.startsWith("image/")) return "image";
        if (file.type.startsWith("text/") || file.type === "application/json") return "text";
        const e = file.name.split(".").pop()?.toLowerCase() || "";
        return TEXT_EXTS.has(e) ? "text" : "other";
      }
      function fmtSize(b) {
        if (b < 1024) return b + "B";
        if (b < 1048576) return (b / 1024).toFixed(1) + "KB";
        return (b / 1048576).toFixed(1) + "MB";
      }

      async function storeFileLF(file, ctx = {}) {
        const id = `f-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
        const type = fileType(file);
        let textContent;
        if (type === "text") {
          try {
            const raw = await file.text();
            textContent = raw.length > 50000 ? raw.slice(0, 50000) + "\n...(생략)" : raw;
          } catch {}
        }
        const meta = {
          id,
          name: file.name,
          mimeType: file.type || "application/octet-stream",
          size: file.size,
          type,
          textContent,
          createdAt: new Date().toISOString(),
          ...ctx,
        };
        await blobStore.setItem(id, file.slice(0, file.size, file.type));
        await metaStore.setItem(id, meta);
        return meta;
      }
      async function getFileBlob(id) {
        try {
          return await blobStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function getFileMeta(id) {
        try {
          return await metaStore.getItem(id);
        } catch {
          return null;
        }
      }
      async function createObjUrl(id) {
        const b = await getFileBlob(id);
        return b ? URL.createObjectURL(b) : null;
      }
      async function fileToBase64(id) {
        const b = await getFileBlob(id);
        if (!b) return null;
        return new Promise((res, rej) => {
          const r = new FileReader();
          r.onload = (e) => res(e.target.result);
          r.onerror = rej;
          r.readAsDataURL(b);
        });
      }
      async function setMsgFiles(msgId, ids) {
        if (!msgId || !ids.length) return;
        await msgFileStore.setItem(msgId, ids);
      }
      async function getMsgFiles(msgId) {
        try {
          return (await msgFileStore.getItem(msgId)) || [];
        } catch {
          return [];
        }
      }
      async function getMsgFileMetas(msgId) {
        const ids = await getMsgFiles(msgId);
        if (!ids.length) return [];
        const r = await Promise.all(ids.map(getFileMeta));
        return r.filter(Boolean);
      }

      // Offline cache
      async function cacheConv(c) {
        try {
          await convStore.setItem(c.id, c);
        } catch {}
      }
      async function getCachedConvs(uid) {
        const res = [];
        await convStore.iterate((v) => {
          if (v.user_id === uid) res.push(v);
        });
        return res.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
      }
      async function delCachedConv(id) {
        try {
          await convStore.removeItem(id);
          await msgStore.iterate(async (v, k) => {
            if (v.conversation_id === id) await msgStore.removeItem(k);
          });
        } catch {}
      }
      async function cacheMsgLF(m) {
        try {
          await msgStore.setItem(m.id, m);
        } catch {}
      }
      async function getCachedMsgs(cid) {
        const res = [];
        await msgStore.iterate((v) => {
          if (v.conversation_id === cid) res.push(v);
        });
        return res.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
      }

      function toast(msg, type = "info", dur = 3000) {
        const el = document.createElement("div");
        el.className = `toast ${type}`;

        const c = document.getElementById("toast-container");
        c.appendChild(el);
        setTimeout(() => {

          setTimeout(() => el.remove(), 300);
        }, dur);

      function mapUser(u) {
        return {
          id: u.id,
          email: u.email,
          username: u.user_metadata?.username || u.user_metadata?.full_name || u.email.split("@")[0],
          avatar: u.user_metadata?.avatar_url,

      // 네트워크 요청이 응답 없이 멈추는 경우를 대비한 타임아웃 헬퍼
      function withTimeout(promise, ms, fallback) {
        return new Promise((resolve) => {
          let done = false;
          const timer = setTimeout(() => {
            if (!done) {
              done = true;
              resolve(fallback);
            }
          }, ms);
          promise.then(
            (v) => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(v);
              }
            },
            () => {
              if (!done) {
                done = true;
                clearTimeout(timer);
                resolve(fallback);
              }
            },
          );
        });
      }

      async function initAuth() {

              .from("custom_gpts")
              .select("*")

      async function loadMessages(convId) {
        if (!convId) {
          setState({ messages: [] });
          return;
        }
        try {
          const { data, error } = await sb
            .from("messages")
            .select("*")
            .eq("conversation_id", convId)
            .order("created_at", { ascending: true });
          if (error) throw error;
          const msgs = await Promise.all(
            (data || []).map(async (m) => {
              const ids = await getMsgFiles(m.id);
              return ids.length ? { ...m, localFileIds: ids } : m;
            }),

          setState({ messages: msgs });

      // ═══════════════════════════════════════════════════════════════
      // 💬  CHAT
      // ═══════════════════════════════════════════════════════════════
      async function processFiles(files, convId) {
        const attachments = [];
        for (const file of files) {
          try {
            const meta = await storeFileLF(file, { conversationId: convId });
            if (meta.type === "image") {
              if (!navigator.onLine) {
                const b64 = await fileToBase64(meta.id);
                if (b64)
                  attachments.push({
                    name: file.name,
                    mimeType: file.type,
                    type: "image",
                    base64: b64,
                    localId: meta.id,
                  });
              } else {
                const safe = file.name.replace(/[^a-zA-Z0-9._\-]/g, "_");
                const path = `${S.user.id}/chat/${Date.now()}_${safe}`;
                const { data, error } = await sb.storage.from("chat-files").upload(path, file);
                if (error) {
                  const b64 = await fileToBase64(meta.id);
                  if (b64)
                    attachments.push({
                      name: file.name,
                      mimeType: file.type,
                      type: "image",
                      base64: b64,
                      localId: meta.id,
                    });
                } else {
                  const { data: s } = await sb.storage.from("chat-files").createSignedUrl(data.path, 3600);
                  attachments.push({
                    name: file.name,
                    mimeType: file.type,
                    type: "image",
                    url: s?.signedUrl,
                    localId: meta.id,
                  });
                }
              }
            } else if (meta.type === "text") {
              attachments.push({
                name: file.name,
                mimeType: file.type,
                type: "text",
                textContent: meta.textContent,
                localId: meta.id,
              });
            } else {
              attachments.push({ name: file.name, mimeType: file.type, type: "other", localId: meta.id });
            }
          } catch (e) {
            console.error(e);
            toast(`파일 처리 실패: ${file.name}`, "error");
          }
        }
        return attachments;
      }

      async function sendMessage(content, filesToSend = []) {
        if (!S.user) return;
        const trimmed = content.trim();
        if (!trimmed && filesToSend.length === 0) return;
        if (S.isStreaming) return;
        if (!S.isOnline) {
          toast("오프라인 상태입니다", "error");
          return;
        }

        let convId = S.currentConvId;
        let savedMsgId = null;
        const tempId = `temp-${Date.now()}`;
        const isGuest = false;

        // Determine system prompt / instructions
        let sysPrompt = S.currentGPT?.system_prompt;
        let instructions = S.currentGPT?.instructions;
        if (convId && !S.currentGPT) {
          const cv = S.conversations.find((c) => c.id === convId);
          if (cv) {
            sysPrompt = cv.system_prompt;
            instructions = cv.instructions;
          }
        }

        // Create conversation if needed
        if (!convId) {
          const title = trimmed.slice(0, 50) || filesToSend[0]?.name || "새 대화";
          if (isGuest) {
            const nc = {
              id: `local-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
              user_id: S.user.id,
              title,
              custom_gpt_id: S.currentGPT?.id || null,
              system_prompt: sysPrompt || "",
              instructions: instructions || "",
              created_at: new Date().toISOString(),
              updated_at: new Date().toISOString(),
            };
            convId = nc.id;
            setState({ conversations: [nc, ...S.conversations], currentConvId: convId });
            await cacheConv(nc).catch(() => {});
          } else {
            const { data, error } = await sb
              .from("conversations")
              .insert({
                user_id: S.user.id,
                title,
                custom_gpt_id: S.currentGPT?.id || null,
                system_prompt: sysPrompt || "",
                instructions: instructions || "",
              })
              .select()
              .single();
            if (error) {
              toast("대화 생성 실패", "error");
              return;
            }
            convId = data.id;
            setState({ conversations: [data, ...S.conversations], currentConvId: convId });
            await cacheConv(data).catch(() => {});
          }
        }

        // Process files
        let chatAttachments = [];
        if (filesToSend.length > 0) {
          chatAttachments = await processFiles(filesToSend, convId);
        }
        const localFileIds = chatAttachments.map((a) => a.localId).filter(Boolean);

        // Build display content
        const imgCnt = chatAttachments.filter((a) => a.type === "image").length;
        const displayContent = trimmed || (imgCnt > 0 ? `📷 이미지 ${imgCnt}개` : `📎 파일 ${filesToSend.length}개`);

        const userMsg = {
          id: tempId,
          conversation_id: convId,
          role: "user",
          content: displayContent,
          created_at: new Date().toISOString(),
          localFileIds: localFileIds.length > 0 ? localFileIds : undefined,
        };
        const currentMsgs = [...S.messages, userMsg];
        setState({ messages: currentMsgs, isStreaming: true, streamingMsg: "", attachedFiles: [] });

        // Save user message
        if (isGuest) {
          savedMsgId = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
          const savedMsg = { ...userMsg, id: savedMsgId };
          await cacheMsgLF(savedMsg).catch(() => {});
          setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
        } else {
          const { data, error } = await sb
            .from("messages")
            .insert({ conversation_id: convId, role: "user", content: displayContent })
            .select()
            .single();
          if (!error) {
            savedMsgId = data.id;
            const savedMsg = { ...data, localFileIds: localFileIds.length > 0 ? localFileIds : undefined };
            await cacheMsgLF(savedMsg).catch(() => {});
            setState({ messages: S.messages.map((m) => (m.id === tempId ? savedMsg : m)) });
          }
        }

        // Link files to message
        if (localFileIds.length > 0 && savedMsgId) {
          await setMsgFiles(savedMsgId, localFileIds).catch(() => {});
        }

        // Stream from AI
        try {
          const {
            data: { session },
          } = await sb.auth.getSession();
          const token = session?.access_token || (isGuest ? "guest-token" : "anon");
          const resp = await fetch(EDGE_FUNCTION_URL, {
            method: "POST",
            headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: currentMsgs.map((m) => ({ role: m.role, content: m.content })),
              systemPrompt: sysPrompt,
              instructions,
              gptFiles: S.currentGPTFiles.length > 0 ? S.currentGPTFiles : undefined,
              chatAttachments: chatAttachments.length > 0 ? chatAttachments : undefined,
              lastUserContent: trimmed,
            }),
          });

          if (!resp.ok) {
            let errMsg = "AI 응답 실패";
            try {
              const t = await resp.text();
              try {
                const j = JSON.parse(t);
                errMsg = j.error || j.message || errMsg;
              } catch {
                errMsg = t.slice(0, 150) || errMsg;
              }
            } catch {}
            if (resp.status === 402) errMsg = "AI 서비스 크레딧이 부족합니다. 관리자에게 문의하세요";
            else if (resp.status === 429) errMsg = "요청이 너무 많습니다. 잠시 후 다시 시도해주세요";
            else if (resp.status >= 500) errMsg = "서버 오류가 발생했습니다. 잠시 후 다시 시도해주세요";
            throw new Error(errMsg);
          }

          const reader = resp.body.getReader();
          const dec = new TextDecoder();
          let full = "",
            buf = "";
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buf += dec.decode(value, { stream: true });
            const lines = buf.split("\n");
            buf = lines.pop() || "";
            for (const line of lines) {
              if (!line.includes("data:")) continue;
              const js = line.replace(/^data:\s*/, "").trim();
              if (js === "[DONE]") continue;
              try {
                const p = JSON.parse(js);
                const d = p.choices?.[0]?.delta?.content || "";
                if (d) {
                  full += d;
                  setState({ streamingMsg: full });
                }
              } catch {}
            }
          }

          if (!full.trim()) throw new Error("AI가 응답을 생성하지 못했습니다");

          // Save AI response
          const aiMsgBase = {
            id: `tmp-${Date.now()}`,
            conversation_id: convId,
            role: "assistant",
            content: full,
            created_at: new Date().toISOString(),
          };
          if (isGuest) {
            aiMsgBase.id = `msg-${Date.now()}-${Math.random().toString(36).slice(2, 9)}`;
            setState({ messages: [...S.messages, aiMsgBase], streamingMsg: "", isStreaming: false });
            await cacheMsgLF(aiMsgBase).catch(() => {});
          } else {
            const { data, error } = await sb
              .from("messages")
              .insert({ conversation_id: convId, role: "assistant", content: full })
              .select()
              .single();
            const finalMsg = error ? aiMsgBase : { ...data };
            setState({ messages: [...S.messages, finalMsg], streamingMsg: "", isStreaming: false });
            if (!error) await cacheMsgLF(finalMsg).catch(() => {});
          }

          // Update conversation title on first message
          if (currentMsgs.length === 1) {
            const newTitle = trimmed.slice(0, 50) || displayContent.slice(0, 50);
            if (!isGuest) {
              sb.from("conversations")
                .update({ title: newTitle, updated_at: new Date().toISOString() })
                .eq("id", convId)
                .then(() => {});
            }
            setState({
              conversations: S.conversations.map((c) =>
                c.id === convId ? { ...c, title: newTitle, updated_at: new Date().toISOString() } : c,
              ),
            });
          }
        } catch (err) {
          console.error("sendMessage error:", err);
          setState({ isStreaming: false, streamingMsg: "" });
          if (!savedMsgId) setState({ messages: S.messages.filter((m) => m.id !== tempId) });
          toast(err.message || "메시지 전송에 실패했습니다", "error");
        }
      }

      // ═══════════════════════════════════════════════════════════════
      // 🤖  GPT BUILDER
      // ═══════════════════════════════════════════════════════════════
      let gptBuilderFiles = []; // tmp before save
      let gptModalPendingDeletes = []; // 기존 DB 파일 중 삭제 예정 목록

      // 커스텀 GPT의 기존 파일을 DB에서 로드
      async function loadGPTFiles(gptId) {
        try {
          const { data, error } = await sb
            .from("custom_gpt_files")
            .select("*")
            .eq("custom_gpt_id", gptId)
            .order("created_at", { ascending: true });
          if (error) throw error;
          return (data || []).map((f) => ({ ...f, isExisting: true }));
        } catch (e) {
          console.error("GPT 파일 로드 실패:", e);
          return [];
        }
      }

      // 개별 파일 DB + Storage 동시 삭제
      async function deleteGPTFileFromDB(file) {
        try {
          if (file.file_path) {
            await sb.storage.from("chat-files").remove([file.file_path]);
          }
          if (file.id && file.isExisting) {
            await sb.from("custom_gpt_files").delete().eq("id", file.id);
          }
        } catch (e) {
          console.error("파일 삭제 실패:", e);
        }
      }

      async function saveGPT(formData) {
        const uid = S.user?.id;
        if (!uid) {
          toast("GPT 저장은 로그인 후 이용 가능합니다", "error");
          return;
        }
        const editing = S.gptBuilderEditing;
        try {
          if (editing) {
            const { data, error } = await sb
              .from("custom_gpts")
              .update({
                name: formData.name,
                description: formData.description,
                system_prompt: formData.systemPrompt,
                instructions: formData.instructions,
                avatar_url: formData.avatarUrl || null,
                is_public: formData.isPublic,
                updated_at: new Date().toISOString(),
              })
              .eq("id", editing.id)
              .select()
              .single();
            if (error) throw error;
            // 삭제 예정 파일 처리 (DB + Storage)
            for (const f of gptModalPendingDeletes) {
              await deleteGPTFileFromDB(f);
            }
            gptModalPendingDeletes = [];
            // 새로 추가된 파일만 저장
            for (const f of gptBuilderFiles) {
              if (!f.isExisting) {
                await sb
                  .from("custom_gpt_files")
                  .insert({
                    custom_gpt_id: editing.id,
                    file_name: f.file_name,
                    file_url: f.file_url || "",
                    file_path: f.file_path || "",
                    file_size: f.file_size,
                    mime_type: f.mime_type,
                    file_content: f.file_content,
                  })
                  .then(() => {});
              }
            }
            setState({
              customGPTs: S.customGPTs.map((g) => (g.id === editing.id ? data : g)),
              gptBuilderOpen: false,
              gptBuilderEditing: null,
            });
            toast("커스텀 GPT가 수정되었습니다", "success");
          } else {
            const { data, error } = await sb
              .from("custom_gpts")
              .insert({
                user_id: uid,
                name: formData.name,
                description: formData.description,
                system_prompt: formData.systemPrompt,
                instructions: formData.instructions,
                avatar_url: formData.avatarUrl || null,
                is_public: formData.isPublic,
              })
              .select()
              .single();
            if (error) throw error;
            for (const f of gptBuilderFiles) {
              await sb
                .from("custom_gpt_files")
                .insert({
                  custom_gpt_id: data.id,
                  file_name: f.file_name,
                  file_url: f.file_url || "",
                  file_path: f.file_path || "",
                  file_size: f.file_size,
                  mime_type: f.mime_type,
                  file_content: f.file_content,
                })
                .then(() => {});
            }

      async function deleteGPT(id) {
        if (!confirm("이 커스텀 GPT를 삭제하시겠습니까?")) return;
        const { error } = await sb.from("custom_gpts").delete().eq("id", id);
        if (error) {
          toast("삭제 실패", "error");
          return;
        }
        setState({ customGPTs: S.customGPTs.filter((g) => g.id !== id) });
        toast("커스텀 GPT가 삭제되었습니다", "success");
      }

      async function startGPTChat(gpt) {
        setState({ currentGPT: gpt });
        try {
          const { data, error } = await sb.from("custom_gpt_files").select("*").eq("custom_gpt_id", gpt.id);
          if (!error) setState({ currentGPTFiles: data || [] });
        } catch {}
        const { data, error } = await sb
          .from("conversations")
          .insert({
            user_id: S.user.id,
            title: `${gpt.name} 대화`,
            custom_gpt_id: gpt.id,
            system_prompt: gpt.system_prompt,
            instructions: gpt.instructions,
          })
          .select()
          .single();
        if (!error) {
          setState({ conversations: [data, ...S.conversations], currentConvId: data.id, messages: [] });
          await cacheConv(data).catch(() => {});
        }
        toast(`${gpt.name}과(와) 대화를 시작합니다`, "success");
      }

      async function deleteConv(id) {
        await sb
          .from("conversations")
          .delete()
          .eq("id", id)
          .then(() => {});
        await delCachedConv(id).catch(() => {});
        const next = S.currentConvId === id ? null : S.currentConvId;
        setState({
          conversations: S.conversations.filter((c) => c.id !== id),
          currentConvId: next,
          messages: next ? S.messages : [],
        });
        toast("대화가 삭제되었습니다", "success");
      }

      function renderAuth() {
        app.innerHTML = `
  <div id="auth-page">

      function renderAuthExtra() {
        const el = document.getElementById("auth-extra");
        if (!el) return;
        if (authState.isLogin) {
          el.innerHTML = `
      <input class="auth-input" type="password" id="auth-pw" placeholder="비밀번호" value="${authState.pw}" ${authState.loading ? "disabled" : ""}>
      <button class="auth-btn primary" id="btn-login" ${authState.loading ? "disabled" : ""}>
        ${authState.loading ? "로그인 중..." : "로그인"}
      </button>`;
          el.querySelector("#auth-pw").addEventListener("input", (e) => {
            authState.pw = e.target.value;
          });
          el.querySelector("#btn-login").addEventListener("click", doLogin);
        } else if (!authState.otpSent) {
          el.innerHTML = `<button class="auth-btn primary" id="btn-otp" ${authState.loading ? "disabled" : ""}>
      ${authState.loading ? "전송 중..." : "인증 코드 받기"}
    </button>`;
          el.querySelector("#btn-otp").addEventListener("click", doSendOtp);
        } else {
          el.innerHTML = `
      <input class="auth-input" placeholder="인증 코드 (4자리)" id="auth-otp" maxlength="4" value="${authState.otp}" ${authState.loading ? "disabled" : ""}>
      <input class="auth-input" type="password" id="auth-pw2" placeholder="비밀번호 설정" value="${authState.pw}" ${authState.loading ? "disabled" : ""}>
      <button class="auth-btn primary" id="btn-register" ${authState.loading ? "disabled" : ""}>
        ${authState.loading ? "가입 중..." : "회원가입 완료"}
      </button>`;
          el.querySelector("#auth-otp").addEventListener("input", (e) => {
            authState.otp = e.target.value;
          });
          el.querySelector("#auth-pw2").addEventListener("input", (e) => {
            authState.pw = e.target.value;
          });
          el.querySelector("#btn-register").addEventListener("click", doRegister);
        }
      }

      function bindAuth() {
        document.getElementById("auth-email")?.addEventListener("input", (e) => {
          authState.email = e.target.value;
        });
        document.getElementById("auth-switch")?.addEventListener("click", () => {
          authState.isLogin = !authState.isLogin;
          authState.otpSent = false;
          authState.otp = "";
          renderAuth();
        });
      }

      async function doSendOtp() {
        authState.loading = true;
        renderAuthExtra();
        const { error } = await sb.auth.signInWithOtp({ email: authState.email, options: { shouldCreateUser: true } });
        authState.loading = false;
        if (error) {
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        authState.otpSent = true;
        toast("인증 코드가 이메일로 전송되었습니다", "success");
        renderAuthExtra();
      }

      async function doRegister() {
        authState.loading = true;
        renderAuthExtra();
        const { data, error } = await sb.auth.verifyOtp({
          email: authState.email,
          token: authState.otp,
          type: "email",
        });
        if (error) {
          authState.loading = false;
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        const { error: ue } = await sb.auth.updateUser({
          password: authState.pw,
          data: { username: authState.email.split("@")[0] },
        });
        if (ue) {
          authState.loading = false;
          toast(ue.message, "error");
          renderAuthExtra();
          return;
        }
        setState({ user: mapUser(data.user), view: "chat" });
        authState.loading = false;
        await loadUserData();
      }

      async function doLogin() {
        authState.loading = true;
        renderAuthExtra();
        const { data, error } = await sb.auth.signInWithPassword({ email: authState.email, password: authState.pw });
        if (error) {
          authState.loading = false;
          toast(error.message, "error");
          renderAuthExtra();
          return;
        }
        setState({ user: mapUser(data.user), view: "chat" });
        authState.loading = false;
        await loadUserData();
      }

      const _renderedMsgIds = new Set();
      function renderMessages() {
        const area = document.getElementById("messages-area");
        if (!area) return;
        const allMsgs = [...S.messages];
        if (S.streamingMsg)
          allMsgs.push({
            id: "__streaming__",
            conversation_id: S.currentConvId,
            role: "assistant",
            content: S.streamingMsg,
            created_at: new Date().toISOString(),
            _streaming: true,
          });

        if (allMsgs.length === 0) {
          area.innerHTML = renderEmptyState();
          _renderedMsgIds.clear();
          return;
        }

        // Ensure messages-inner exists
        let inner = document.getElementById("messages-inner");
        if (!inner || area.querySelector("#empty-state")) {
          area.innerHTML = '<div class="messages-inner" id="messages-inner"></div>';
          inner = document.getElementById("messages-inner");
          _renderedMsgIds.clear();
        }

        // Remove old streaming element
        const oldStream = inner.querySelector("[data-streaming]");
        if (oldStream && !S.streamingMsg) oldStream.remove();

        // Append new messages
        for (const msg of allMsgs) {
          if (_renderedMsgIds.has(msg.id)) {
            // Update streaming message
            if (msg.id === "__streaming__") {
              const el = inner.querySelector("[data-streaming]");
              if (el) {
                el.querySelector(".msg-text").textContent = msg.content;
              }
            }
            continue;
          }
          _renderedMsgIds.add(msg.id);
          const el = createMsgEl(msg);
          inner.appendChild(el);
          if (msg.localFileIds?.length > 0) loadMsgFiles(msg.id, el);
        }

        // Scroll to bottom
        area.scrollTop = area.scrollHeight;
      }

      function createMsgEl(msg) {
        const div = document.createElement("div");
        div.className = `message ${msg.role}`;
        div.setAttribute("data-mid", msg.id);
        if (msg._streaming) div.setAttribute("data-streaming", "1");
        const avatarClass = msg.role === "user" ? "user" : "assistant";
        const avatarIcon = msg.role === "user" ? iconSvg("User", 16) : iconSvg("Bot", 16);
        div.innerHTML = `<div class="message-inner">
    <div class="msg-avatar ${avatarClass}">${avatarIcon}</div>
    <div class="msg-body">
      <div class="msg-files" data-files-placeholder></div>
      <div class="msg-text">${escHtml(msg.content)}${msg._streaming ? '<span class="msg-cursor"></span>' : ""}</div>
    </div>
  </div>`;
        return div;
      }

        const fp = msgEl.querySelector("[data-files-placeholder]");
        if (!fp) return;
        fp.innerHTML = "";
        for (const meta of metas) {
          if (meta.type === "image") {
            const url = await createObjUrl(meta.id);
            if (url) {
              const d = document.createElement("div");
              d.className = "msg-img-thumb";
              const img = document.createElement("img");
              img.src = url;
              img.alt = meta.name;
              d.appendChild(img);
              fp.appendChild(d);

            const d = document.createElement("div");
            d.className = "msg-file-chip";
            d.innerHTML = `${iconSvg("FileText", 14)}<div><div class="fc-name">${escHtml(meta.name)}</div><div class="fc-size">${fmtSize(meta.size)}</div></div>`;

        }
      }

      function renderGPTFileList() {
        const el = document.getElementById("gf-file-list");
        if (!el) return;
        el.innerHTML = "";

          el.innerHTML =
            '<div style="color:var(--text-dim);font-size:12px;padding:8px 4px;">첨부된 파일이 없습니다</div>';
          return;
        }
        for (let i = 0; i < gptModalFiles.length; i++) {
          const f = gptModalFiles[i];
          const isPending = f.isExisting && gptModalPendingDeletes.some((dd) => dd.id === f.id);
          const d = document.createElement("div");
          d.className = "file-list-item";
          d.style.opacity = isPending ? "0.45" : "1";
          d.style.textDecoration = isPending ? "line-through" : "none";
          const statusBadge = f.isExisting
            ? `<span style="font-size:10px;background:rgba(16,163,127,0.18);color:#10a37f;padding:2px 7px;border-radius:9999px;flex-shrink:0;">저장됨</span>`
            : `<span style="font-size:10px;background:rgba(59,130,246,0.18);color:#60a5fa;padding:2px 7px;border-radius:9999px;flex-shrink:0;">새파일</span>`;
          const delLabel = isPending ? "되돌리기" : "삭제";
          const delColor = isPending ? "var(--text-muted)" : "var(--danger)";
          const delIcon = isPending ? iconSvg("Plus", 14) : iconSvg("Trash2", 14);
          d.innerHTML = `${iconSvg("FileText", 16)}<div class="file-list-name">${escHtml(f.file_name)}</div>${statusBadge}<span class="file-list-size">${fmtSize(f.file_size)}</span><button class="file-list-del" data-idx="${i}" title="${delLabel}" style="color:${delColor}">${delIcon}</button>`;
          d.querySelector("[data-idx]").addEventListener("click", () => {
            const target = gptModalFiles[i];
            if (target && target.isExisting) {
              // 기존 DB 파일: 삭제 예정 토글
              const pIdx = gptModalPendingDeletes.findIndex((x) => x.id === target.id);
              if (pIdx >= 0) {
                gptModalPendingDeletes.splice(pIdx, 1);
              } else {
                gptModalPendingDeletes.push(target);
              }
            } else if (target) {
              // 새 파일: 즉시 목록에서 제거
              gptModalFiles.splice(i, 1);
            }
            renderGPTFileList();
          });
          el.appendChild(d);
        }
        if (gptModalPendingDeletes.length > 0) {
          const notice = document.createElement("div");
          notice.style.cssText = "font-size:11px;color:var(--danger);padding:6px 4px;margin-top:4px;";
          notice.textContent = `⚠️ ${gptModalPendingDeletes.length}개 파일이 '저장' 시 영구 삭제됩니다`;
          el.appendChild(notice);
        }
      }

      async function handleGPTFileUpload(e) {
        const files = Array.from(e.target.files || []);
        if (!files.length) return;
        const btn = document.getElementById("modal-save");
        if (btn) btn.disabled = true;
        for (const file of files) {
          try {
            const safe = file.name.replace(/[^a-zA-Z0-9._\-가-힣]/g, "_");
            const path = `${S.user.id}/gpt-files/${Date.now()}_${safe}`;
            const { data, error } = await sb.storage.from("chat-files").upload(path, file);
            if (error) {
              toast(`${file.name} 업로드 실패: ${error.message}`, "error");
              continue;
            }
            const { data: sd } = await sb.storage.from("chat-files").createSignedUrl(data.path, 60 * 60 * 24 * 365);
            let fc;
            try {
              fc = await file.text();
              if (fc.length > 50000) fc = fc.slice(0, 50000) + "\n...(생략)";
            } catch {}
            const TEXT_EXT2 = new Set([
              "txt",
              "md",
              "csv",
              "json",
              "log",
              "xml",
              "yaml",
              "yml",
              "ts",
              "tsx",
              "js",
              "jsx",
              "py",
              "css",
              "html",
              "sh",
              "env",
            ]);
            const ext = file.name.split(".").pop()?.toLowerCase() || "";
            if (!file.type.startsWith("text/") && !TEXT_EXT2.has(ext)) fc = undefined;
            gptModalFiles.push({
              id: crypto.randomUUID(),
              custom_gpt_id: "",
              file_name: file.name,
              file_url: sd?.signedUrl || "",
              file_path: data.path,
              file_size: file.size,
              mime_type: file.type || "application/octet-stream",
              file_content: fc,
              created_at: new Date().toISOString(),
            });
            toast(`${file.name} 업로드 완료`, "success");
          } catch (err) {
            toast(`${file.name}: ${err.message}`, "error");
          }
        }
        if (btn) btn.disabled = false;
        renderGPTFileList();
        if (e.target) e.target.value = "";
      }

      // ── BIND MAIN EVENTS ─────────────────────────────────────────
      function bindMain() {
        // New chat
        document.getElementById("btn-new-chat")?.addEventListener("click", () => {
          _renderedMsgIds.clear();
          setState({ currentConvId: null, messages: [], streamingMsg: "", currentGPT: null, currentGPTFiles: [] });
        });

        // Browser panel toggle (split view alongside chat)
        document.getElementById("btn-open-browser")?.addEventListener("click", () => {
          if (S.browserOpen) closeBrowserOverlay();
          else openBrowserOverlay();
        });

        // Sidebar drawer toggle (slide open/close)
        document.getElementById("btn-toggle-sidebar")?.addEventListener("click", () => {
          setState({ sidebarOpen: !S.sidebarOpen });
        });
        document.getElementById("sidebar-backdrop")?.addEventListener("click", () => {
          setState({ sidebarOpen: false });
        });

        // User dropdown
        document.getElementById("user-btn")?.addEventListener("click", (e) => {
          e.stopPropagation();
          setState({ dropdownOpen: !S.dropdownOpen });
        });
        document.addEventListener(
          "click",
          () => {
            if (S.dropdownOpen) setState({ dropdownOpen: false });
          },
          { once: true },
        );
        document.getElementById("dd-logout")?.addEventListener("click", doLogout);
        document.getElementById("dd-queue")?.addEventListener("click", () => {
          setState({ dropdownOpen: false });
          toast("오프라인 큐 처리 완료", "info");
        });

        // File attach
        document
          .getElementById("btn-attach")
          ?.addEventListener("click", () => document.getElementById("file-input").click());
        document.getElementById("file-input")?.addEventListener("change", (e) => {
          const files = Array.from(e.target.files || []);
          const newFiles = files.map((f) => ({
            id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            file: f,
            previewUrl: f.type.startsWith("image/") ? URL.createObjectURL(f) : undefined,
          }));
          setState({ attachedFiles: [...S.attachedFiles, ...newFiles] });
          if (e.target) e.target.value = "";
        });

        // Send button
        document.getElementById("btn-send")?.addEventListener("click", doSend);

        // Textarea
        const ta = document.getElementById("msg-input");
        if (ta) {
          ta.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
              e.preventDefault();
              doSend();
            }
          });
          ta.addEventListener("input", (e) => {
            const el = e.target;
            el.style.height = "auto";
            el.style.height = Math.min(el.scrollHeight, 180) + "px";
          });
        }

        // Close dropdown on outside click
        document.getElementById("content-area")?.addEventListener("click", () => {
          if (S.dropdownOpen) setState({ dropdownOpen: false });
        });
      }

      function doSend() {
        const ta = document.getElementById("msg-input");
        const content = ta?.value || "";
        const files = S.attachedFiles.map((f) => f.file);
        // Revoke preview URLs
        S.attachedFiles.forEach((f) => {
          if (f.previewUrl) URL.revokeObjectURL(f.previewUrl);
        });
        if (ta) ta.value = "";
        if (ta) {
          ta.style.height = "auto";
        }
        sendMessage(content, files);
      }

      function escHtml(s) {
        return String(s || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

        if (S.loading) {
          document.getElementById("loading-screen").classList.remove("hidden");
          return;

        document.getElementById("loading-screen").classList.add("hidden");
        if (S.view === "auth") {
          app.innerHTML = "";
          renderAuth();
          return;
        }
        // Check if we need full re-render
        if (!document.getElementById("main-layout")) {
          app.innerHTML = "";
          _renderedMsgIds.clear();
          renderMain();
          return;
        }
        // Targeted updates
        updateConvList();
        updateGPTSection();
        updateMessages();
        updateHeader();
        updateFilePreviews();
        updateGPTBanner();
        updateSidebarDrawer();
        if (S.gptBuilderOpen && !document.getElementById("gpt-modal")?.classList.contains("hidden") === false)
          renderGPTModal();
