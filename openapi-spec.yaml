openapi: 3.1.0
info:
  title: OpenRouter Chat API
  version: 1.0.0
  description: Generated OpenAPI specification for the chat completions endpoint.
servers:
  - url: https://openrouter.ai/api/v1
paths:
  /chat/completions:
    post:
      summary: Create chat completions
      operationId: createChatCompletion
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model
                - messages
              properties:
                model:
                  type: string
                  example: "@preset/open-ai-gpt-oss-20b-free-uncensored"
                messages:
                  type: array
                  items:
                    type: object
                    required:
                      - role
                      - content
                    properties:
                      role:
                        type: string
                        example: user
                      content:
                        type: string
                        example: "Hello! How are you today?"
      responses:
        '200':
          description: Successful completion response
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
